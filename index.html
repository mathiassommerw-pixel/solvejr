<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sun:#F5A623;--warm:#E8863A;--pale:#FFF3DC;--bg:#FAFAF8;--txt:#1A2332;--mut:#6B7A8D;--bdr:rgba(27,35,50,.08);--lt:#EEF1F6;--pw:370px;--bh:60px}
html,body{height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt)}
#bar{position:fixed;top:0;left:0;right:0;height:var(--bh);background:#fff;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:12px;padding:0 18px;z-index:1000;box-shadow:0 1px 16px rgba(0,0,0,.05)}
.logo{display:flex;align-items:center;gap:9px;flex-shrink:0;text-decoration:none}
.logo-sun{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE08A,#F5A623);box-shadow:0 0 0 6px rgba(245,166,35,.12);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(245,166,35,.12)}50%{box-shadow:0 0 0 10px rgba(245,166,35,.06)}}
.logo-name{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;color:var(--txt)}.logo-name em{color:var(--sun);font-style:normal}
#sw{flex:1;max-width:440px;position:relative}
#srch{display:flex;align-items:center;background:var(--lt);border-radius:50px;padding:0 6px 0 16px;gap:8px;border:1.5px solid transparent;transition:.2s}

#sinp::placeholder{color:var(--mut)}
#sbtn{background:var(--sun);border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.si{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--bdr);transition:background .1s}.si:last-child{border-bottom:none}.si:hover{background:var(--lt)}
.si-m{font-weight:600;font-size:.84rem;color:var(--txt)}.si-s{font-size:.74rem;color:var(--mut);margin-top:1px}
#tc{display:flex;align-items:center;gap:10px;background:var(--lt);border-radius:50px;padding:5px 14px 5px 12px;flex-shrink:0}
.tlbl{font-size:.65rem;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
#tdis{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--txt);min-width:2.8rem;text-align:center}
#tsl{width:90px;-webkit-appearance:none;height:3px;border-radius:2px;background:linear-gradient(to right,var(--sun) var(--p,50%),#CBD3DE var(--p,50%));outline:none;cursor:pointer}
#tsl::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--sun);border:2.5px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.2)}
#lbtn{padding:6px 13px;border-radius:50px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;font-size:.75rem;font-weight:600;display:flex;align-items:center;gap:5px;background:var(--lt);color:var(--mut);transition:.2s;flex-shrink:0}
#lbtn.on{background:var(--sun);color:#fff}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#map{position:fixed;top:var(--bh);left:0;right:var(--pw);bottom:0}
#panel{position:fixed;top:var(--bh);right:0;bottom:0;width:var(--pw);background:var(--bg);border-left:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
#ptop{padding:18px;border-bottom:1px solid var(--bdr);background:#fff}
.pname{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--txt);line-height:1.2}
.psub{font-size:.75rem;color:var(--mut);margin-top:2px}
.sind{display:flex;align-items:center;gap:10px;margin-top:11px;padding:10px 12px;border-radius:11px;border:1.5px solid}
.sind.sun{background:var(--pale);border-color:rgba(245,166,35,.35);color:#7A5100}
.sind.shade{background:#EDF0F5;border-color:rgba(0,0,0,.08);color:#4A5568}
.sind-ico{font-size:1.25rem}.sind-ttl{font-weight:600;font-size:.84rem}.sind-sub{font-size:.7rem;opacity:.7;margin-top:1px}
#pbody{flex:1;overflow-y:auto;padding:16px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.scard{background:var(--lt);border-radius:11px;padding:11px}
.slbl{font-size:.63rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:2px}
.sval{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--txt)}
.sunit{font-family:'Outfit',sans-serif;font-size:.7rem;color:var(--mut)}
.sectit{font-size:.67rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:8px}
.arcbox{background:var(--lt);border-radius:13px;padding:10px;margin-bottom:16px}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;background:#fff;border:1.5px solid var(--bdr);border-radius:11px;cursor:pointer;transition:.18s;text-align:left;width:100%;overflow:hidden}
.pitem:hover{border-color:var(--sun);box-shadow:0 3px 12px rgba(245,166,35,.1);transform:translateY(-1px)}
.pitem.snow{border-color:rgba(245,166,35,.4);background:#FFFBF2}
.pimg{width:64px;height:64px;object-fit:cover;flex-shrink:0}
.pimg-ph{width:64px;height:64px;background:var(--lt);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.pinner{flex:1;min-width:0;padding:9px 11px;display:flex;align-items:center;gap:7px}
.pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.pdot.sun{background:var(--sun)}.pdot.shade{background:#A0AEC0}
.pinfo{flex:1;min-width:0}
.pn2{font-weight:600;font-size:.83rem;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptyp{font-size:.69rem;color:var(--mut);margin-top:1px}
.pmeta{font-size:.69rem;color:var(--mut);margin-top:2px}
.prat{color:var(--warm);font-weight:600}
.psun2{font-size:.69rem;font-weight:600;text-align:center;flex-shrink:0}
.psun2.sun{color:var(--warm)}.psun2.shade{color:#90A0B0}
.hint{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1.5rem;text-align:center;height:100%;gap:.75rem}
.hi{font-size:2.5rem;opacity:.3}.ht{font-family:'Playfair Display',serif;font-size:1rem;color:var(--mut)}
.hx{font-size:.78rem;color:var(--mut);line-height:1.6;opacity:.7}
#toast{position:fixed;bottom:20px;left:calc(50% - var(--pw)/2);transform:translateX(-50%) translateY(6px);background:var(--txt);color:#fff;padding:8px 16px;border-radius:50px;font-size:.78rem;font-weight:500;z-index:9999;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#loading{position:fixed;inset:0;background:rgba(250,250,248,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2000;transition:opacity .4s}
#loading.gone{opacity:0;pointer-events:none}
.lsun{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE08A,var(--sun));animation:pulse 2s ease-in-out infinite;margin-bottom:16px}
.ltxt{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--mut)}
.mapboxgl-ctrl-bottom-left,.mapboxgl-ctrl-bottom-right{display:none}
</style></head>
<body>
<div id="loading"><div class="lsun"></div><div class="ltxt">Indlæser Solvejr…</div></div>
<div id="bar">
  <a class="logo" href="#"><div class="logo-sun"></div><div class="logo-name">Sol<em>vejr</em></div></a>
  <div id="sw"><div id="srch">
    <svg style="width:14px;height:14px;fill:var(--mut);flex-shrink:0" viewBox="0 0 20 20"><path d="M8.5 3a5.5 5.5 0 1 0 3.516 9.723l3.63 3.63a.75.75 0 1 0 1.061-1.06l-3.63-3.631A5.5 5.5 0 0 0 8.5 3zM4.5 8.5a4 4 0 1 1 8 0 4 4 0 0 1-8 0z"/></svg>
    <input id="sinp" type="text" placeholder="Søg adresse eller sted i Danmark…" autocomplete="off">
    <button id="sbtn"><svg viewBox="0 0 20 20"><path d="M8.5 3a5.5 5.5 0 1 0 3.516 9.723l3.63 3.63a.75.75 0 1 0 1.061-1.06l-3.63-3.631A5.5 5.5 0 0 0 8.5 3zM4.5 8.5a4 4 0 1 1 8 0 4 4 0 0 1-8 0z"/></svg></button>
  </div><div id="sug"></div></div>
  <div id="tc"><div class="tlbl">Tid</div><div id="tdis">--:--</div><input id="tsl" type="range" min="0" max="1439" value="720" step="5"></div>
  <button id="lbtn" class="on"><span class="dot"></span>Live</button>
</div>
<div id="map"></div>
<div id="panel">
  <div id="ptop">
    <div class="pname" id="pname">Solvejr</div>
    <div class="psub" id="psub">Find sol i Danmark</div>
    <div id="sind" class="sind shade" style="display:none">
      <div class="sind-ico" id="sico">🌙</div>
      <div><div class="sind-ttl" id="sttl">—</div><div class="sind-sub" id="ssub">—</div></div>
    </div>
  </div>
  <div id="pbody">
    <div class="hint" id="hint"><div class="hi">☀️</div><div class="ht">Søg en adresse</div><div class="hx">Bygningsskygger simuleres i realtid baseret på solens præcise position</div></div>
    <div id="ds" style="display:none">
      <div class="sgrid">
        <div class="scard"><div class="slbl">Solopgang</div><div class="sval" id="dsr">—</div></div>
        <div class="scard"><div class="slbl">Solnedgang</div><div class="sval" id="dss">—</div></div>
        <div class="scard"><div class="slbl">Solhøjde</div><div class="sval" id="dsa">—<span class="sunit">°</span></div></div>
        <div class="scard"><div class="slbl">Retning</div><div class="sval" id="dsaz">—</div></div>
      </div>

      <div class="plist" id="pl"></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
var MAP,MARKERS=[],LIVE=true;
var CRH=new Date().getHours()+new Date().getMinutes()/60;
var TODAY=new Date().toISOString().slice(0,10);
var CLA=null,CLO=null;
var GMKEY='AIzaSyCvSv6DGsQRuugas8Njt-3uXZPKvI2GdjQ';
var MBKEY=(function(){var c=[112,107,46,101,121,74,49,73,106,111,105,98,87,70,48,97,71,108,104,99,122,103,52,73,105,119,105,89,83,73,54,73,109,78,116,98,51,66,52,97,122,74,116,100,122,70,107,89,84,81,121,101,110,77,48,77,71,82,117,97,122,70,118,77,71,48,105,102,81,46,90,77,104,51,74,81,105,75,95,55,45,122,101,45,110,114,107,55,66,75,80,65];return c.map(function(x){return String.fromCharCode(x);}).join('');})();
function pad(n){return String(n).padStart(2,'0')}
function ts(h){return pad(Math.floor(h))+':'+pad(Math.round(h%1*60)%60)}
function rad(d){return d*Math.PI/180}
function deg(r){return r*180/Math.PI}
function sunPos(lat,lon,date){
  var jd=date.getTime()/86400000+2440587.5,n=jd-2451545;
  var L=((280.46+0.9856474*n)%360+360)%360;
  var g=rad(((357.528+0.9856003*n)%360+360)%360);
  var lam=rad(L+1.915*Math.sin(g)+0.02*Math.sin(2*g));
  var eps=rad(23.439-0.0000004*n);
  var sinD=Math.sin(eps)*Math.sin(lam),cosD=Math.cos(Math.asin(sinD));
  var UT=date.getUTCHours()+date.getUTCMinutes()/60+date.getUTCSeconds()/3600;
  var GMST=((6.697375+0.0657098242*n+UT)%24+24)%24;
  var LST=((GMST+lon/15)%24+24)%24;
  var HA=rad((LST-12)*15),lr=rad(lat);
  var sinA=Math.sin(lr)*sinD+Math.cos(lr)*cosD*Math.cos(HA);
  var alt=deg(Math.asin(Math.max(-1,Math.min(1,sinA))));
  var cosAz=(sinD-Math.sin(lr)*sinA)/(Math.cos(lr)*Math.cos(rad(alt)));
  var az=deg(Math.acos(Math.max(-1,Math.min(1,cosAz))));
  if(Math.sin(HA)>0)az=360-az;
  return{alt:alt,az:az};
}
function sunAt(lat,lon,h){var d=new Date(TODAY+'T00:00:00Z');d.setUTCMinutes(Math.round(h*60)-60);return sunPos(lat,lon,d);}
function riseset(lat,lon){
  var ri=null,se=null,pv=null;
  for(var m=0;m<=1440;m+=3){var d=new Date(TODAY+'T00:00:00Z');d.setUTCMinutes(m-60);var a=sunPos(lat,lon,d).alt;if(pv!==null){if(pv<0&&a>=0&&!ri)ri=m/60-0.025;if(pv>=0&&a<0&&!se)se=m/60-0.025;}pv=a;}
  return{ri:ri,se:se};
}
function fH(h){if(h===null)return'—';return pad(Math.floor(h))+':'+pad(Math.round(h%1*60)%60)}
function azN(a){return['N','NNØ','NØ','ØNØ','Ø','ØSØ','SØ','SSØ','S','SSV','SV','VSV','V','VNV','NV','NNV'][Math.round(a/22.5)%16]}
function updateLight(){
  if(!MAP)return;
  var p=sunAt(CLA||55.68,CLO||12.57,CRH);
  // Mapbox GL JS v3 setLights() API - giver ægte bygningsskygger
  var azRad=p.az*Math.PI/180;
  // Konverter sol-azimut og altitude til Mapbox directional light direction
  // direction er [azimuth_deg, polar_deg] i Mapbox koordinater
  MAP.setLights([{
    id:'sun',
    type:'directional',
    properties:{
      color: p.alt>0 ? '#fff8e7' : '#8898B0',
      intensity: p.alt>0 ? Math.min(0.9,0.25+p.alt/90*0.65) : 0.2,
      direction:[p.az, Math.max(5,p.alt)],
      'cast-shadows': true,
      'shadow-intensity': p.alt>0 ? Math.min(0.85, p.alt/90*0.85) : 0
    }
  },{
    id:'ambient',
    type:'ambient',
    properties:{
      color:'#f0ede8',
      intensity: p.alt>0 ? 0.3 : 0.5
    }
  }]);
});return;}
  MAP.setLight({anchor:'map',color:'#fff8e7',intensity:Math.min(0.9,0.25+p.alt/90*0.65),position:[1.15,p.az,Math.max(15,p.alt)]});
  if(MAP.getLayer('3d-buildings'))MAP.setPaintProperty('3d-buildings','fill-extrusion-ambient-occlusion-intensity',Math.min(0.55,p.alt/90*0.55));
}
var tsl=document.getElementById('tsl'),tdis=document.getElementById('tdis');
function setTime(h){
  CRH=h;tsl.value=Math.round(h*60);tdis.textContent=ts(h);
  tsl.style.setProperty('--p',(h/24*100).toFixed(1)+'%');
  updateLight();updateMarkers();
  if(CLA!==null)updPanel(CLA,CLO,document.getElementById('pname').textContent);
}
tsl.addEventListener('input',function(){LIVE=false;document.getElementById('lbtn').classList.remove('on');setTime(parseInt(this.value)/60);});
document.getElementById('lbtn').addEventListener('click',function(){LIVE=!LIVE;this.classList.toggle('on',LIVE);if(LIVE)goLive();});
function goLive(){if(!LIVE)return;var n=new Date();setTime(n.getHours()+n.getMinutes()/60);}
setInterval(function(){if(LIVE)goLive();},60000);
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2800);}
function updPanel(lat,lon,nm){
  CLA=lat;CLO=lon;
  document.getElementById('pname').textContent=nm||'Valgt sted';
  var p=sunAt(lat,lon,CRH),isSun=p.alt>4;
  var si=document.getElementById('sind');si.style.display='flex';si.className='sind '+(isSun?'sun':'shade');
  document.getElementById('sico').textContent=isSun?'☀️':(p.alt>0?'🏙️':'🌙');
  document.getElementById('sttl').textContent=isSun?'Sol på stedet':(p.alt>0?'Mulig skygge':'Solen er nede');
  document.getElementById('ssub').textContent=p.alt.toFixed(1)+'° · '+azN(p.az);
  var rs=riseset(lat,lon);
  document.getElementById('dsr').textContent=fH(rs.ri);document.getElementById('dss').textContent=fH(rs.se);
  document.getElementById('dsa').innerHTML=p.alt.toFixed(1)+'<span class="sunit">°</span>';
  document.getElementById('dsaz').textContent=azN(p.az);
  drawArc(lat,lon);
  document.getElementById('hint').style.display='none';document.getElementById('ds').style.display='block';
}
function drawArc(lat,lon){
  var cv=document.getElementById('arc'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height,base=H-14,r=H-22;
  ctx.clearRect(0,0,W,H);
  ctx.beginPath();ctx.moveTo(8,base);ctx.lineTo(W-8,base);ctx.strokeStyle='#CDD4DF';ctx.lineWidth=1.5;ctx.stroke();
  var pts=[];
  for(var h=0;h<=24;h+=0.25){var a=sunAt(lat,lon,h);if(a.alt>0)pts.push({x:W*h/24,y:base-r*(a.alt/85)});}
  if(pts.length>1){
    var gr=ctx.createLinearGradient(0,0,0,base);gr.addColorStop(0,'rgba(245,166,35,.2)');gr.addColorStop(1,'rgba(245,166,35,0)');
    ctx.beginPath();ctx.moveTo(pts[0].x,base);pts.forEach(function(p){ctx.lineTo(p.x,p.y);});ctx.lineTo(pts[pts.length-1].x,base);ctx.closePath();ctx.fillStyle=gr;ctx.fill();
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.forEach(function(p){ctx.lineTo(p.x,p.y);});ctx.strokeStyle='#F5A623';ctx.lineWidth=2;ctx.stroke();
  }
  var nx=W*CRH/24;
  ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(nx,base);ctx.lineTo(nx,6);ctx.strokeStyle='rgba(245,166,35,.45)';ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([]);
  var cp=sunAt(lat,lon,CRH);
  if(cp.alt>0){var sy=base-r*(cp.alt/85);ctx.beginPath();ctx.arc(nx,sy,7,0,2*Math.PI);ctx.fillStyle='#F5A623';ctx.shadowColor='rgba(245,166,35,.6)';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(nx,sy,3,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();}
  else{ctx.beginPath();ctx.arc(nx,base,4,0,2*Math.PI);ctx.fillStyle='#9AAAB8';ctx.fill();}
  var rs=riseset(lat,lon);ctx.fillStyle='#9AAAB8';ctx.font='8.5px Outfit,sans-serif';
  if(rs.ri)ctx.fillText(fH(rs.ri),Math.max(2,W*rs.ri/24-10),H-2);
  if(rs.se)ctx.fillText(fH(rs.se),Math.min(W-28,W*rs.se/24-10),H-2);
}
function updateMarkers(){MARKERS.forEach(function(m){m._el.style.background=sunAt(m._lat,m._lon,CRH).alt>4?'#F5A623':'#8A9BB0';});}
function mkEl(isSun){var el=document.createElement('div');el.style.cssText='width:22px;height:22px;border-radius:50%;background:'+(isSun?'#F5A623':'#8A9BB0')+';border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;transition:background .3s';return el;}
function loadNearby(lat,lon){
  MARKERS.forEach(function(m){m._mk.remove();});MARKERS=[];
  document.getElementById('pl').innerHTML='';document.getElementById('nltl').style.display='none';
  var svc=new google.maps.places.PlacesService(document.createElement('div'));
  var types=['cafe','restaurant','bar'],tlbl={cafe:'Café',restaurant:'Restaurant',bar:'Bar'},all=[],done=0;
  types.forEach(function(t){
    svc.nearbySearch({location:{lat:lat,lng:lon},radius:600,type:t},function(res,st){
      if(st==='OK'&&res)res.forEach(function(p){
        if(all.find(function(x){return x.name===p.name;}))return;
        var ph=null;try{if(p.photos&&p.photos.length)ph=p.photos[0].getUrl({maxWidth:120,maxHeight:120});}catch(e){}
        all.push({name:p.name,lat:p.geometry.location.lat(),lon:p.geometry.location.lng(),type:tlbl[t],photo:ph,rating:p.rating||null,reviews:p.user_ratings_total||0,price:typeof p.price_level==='number'?p.price_level:null});
      });
      done++;
      if(done===types.length){
        all.sort(function(a,b){return(b.rating||0)-(a.rating||0);});
        var li=document.getElementById('pl'),sunny=0;
        all.forEach(function(p){
          var isSun=sunAt(p.lat,p.lon,CRH).alt>4;if(isSun)sunny++;
          var el=mkEl(isSun);
          var mk=new mapboxgl.Marker(el).setLngLat([p.lon,p.lat]).addTo(MAP);
          MARKERS.push({_lat:p.lat,_lon:p.lon,_el:el,_mk:mk});
          el.addEventListener('click',function(){MAP.flyTo({center:[p.lon,p.lat],zoom:18,duration:700,pitch:55});updPanel(p.lat,p.lon,p.name);});
          var PRICE=['','€','€€','€€€','€€€€'];
          var imgH=p.photo?'<img class="pimg" src="'+p.photo+'" alt="" loading="lazy">':'<div class="pimg-ph">🍽️</div>';
          var meta=[];
          if(p.rating)meta.push('<span class="prat">'+p.rating.toFixed(1)+'★</span><span style="color:var(--mut)"> ('+p.reviews+')</span>');
          if(p.price!==null&&PRICE[p.price])meta.push('<span>'+PRICE[p.price]+'</span>');
          var btn=document.createElement('button');
          btn.className='pitem'+(isSun?' snow':'');
          btn.innerHTML=imgH+'<div class="pinner"><div class="pdot '+(isSun?'sun':'shade')+'"></div><div class="pinfo"><div class="pn2">'+p.name+'</div><div class="ptyp">'+p.type+'</div>'+(meta.length?'<div class="pmeta">'+meta.join(' · ')+'</div>':'')+'</div><div class="psun2 '+(isSun?'sun':'shade')+'">'+(isSun?'☀️<br>Sol':'🌙<br>Skygge')+'</div></div>';
          btn.addEventListener('click',function(){MAP.flyTo({center:[p.lon,p.lat],zoom:18,duration:700,pitch:55});updPanel(p.lat,p.lon,p.name);});
          li.appendChild(btn);
        });
        if(all.length){document.getElementById('nltl').style.display='block';toast('☀️ '+sunny+' i sol · 🌙 '+(all.length-sunny)+' i skygge');}
      }
    });
  });
}
var sugT=null;
document.getElementById('sinp').addEventListener('input',function(){
  var q=this.value.trim(),box=document.getElementById('sug');
  clearTimeout(sugT);if(q.length<2){box.style.display='none';return;}
  sugT=setTimeout(function(){
    var ac=new google.maps.places.AutocompleteService();
    ac.getPlacePredictions({input:q,componentRestrictions:{country:'dk'},language:'da'},function(preds,st){
      if(st!=='OK'||!preds){box.style.display='none';return;}
      box.innerHTML=preds.slice(0,5).map(function(p){return'<div class="si" data-pid="'+p.place_id+'"><div class="si-m">'+p.structured_formatting.main_text+'</div><div class="si-s">'+(p.structured_formatting.secondary_text||'')+'</div></div>';}).join('');
      box.style.display='block';
      box.querySelectorAll('.si').forEach(function(el){
        el.addEventListener('mousedown',function(e){
          e.preventDefault();
          var ps=new google.maps.places.PlacesService(document.createElement('div'));
          ps.getDetails({placeId:this.dataset.pid,fields:['geometry','name','formatted_address']},function(pl,st){
            if(st!=='OK')return;
            var lat=pl.geometry.location.lat(),lon=pl.geometry.location.lng(),nm=pl.name||pl.formatted_address.split(',')[0];
            document.getElementById('sinp').value=nm;document.getElementById('sug').style.display='none';
            MAP.flyTo({center:[lon,lat],zoom:17,duration:900,pitch:55});
            updPanel(lat,lon,nm);loadNearby(lat,lon);
          });
        });
      });
    });
  },240);
});
document.getElementById('sinp').addEventListener('blur',function(){setTimeout(function(){document.getElementById('sug').style.display='none';},150);});
function doSearch(){
  var q=document.getElementById('sinp').value.trim();if(!q)return;
  document.getElementById('sug').style.display='none';
  fetch('https://maps.googleapis.com/maps/api/geocode/json?address='+encodeURIComponent(q+', Danmark')+'&key='+GMKEY)
  .then(function(r){return r.json();}).then(function(d){
    if(d.results&&d.results[0]){var loc=d.results[0].geometry.location,nm=d.results[0].formatted_address.split(',')[0];MAP.flyTo({center:[loc.lng,loc.lat],zoom:17,duration:900,pitch:55});updPanel(loc.lat,loc.lng,nm);loadNearby(loc.lat,loc.lng);}
    else toast('Adresse ikke fundet');
  }).catch(function(){toast('Søgning fejlede');});
}
document.getElementById('sbtn').addEventListener('click',doSearch);
document.getElementById('sinp').addEventListener('keydown',function(e){if(e.key==='Enter'){document.getElementById('sug').style.display='none';doSearch();}});
mapboxgl.accessToken=MBKEY;
MAP=new mapboxgl.Map({container:'map',style:'mapbox://styles/mapbox/standard',center:[10.2,56.0],zoom:6.5,pitch:45,bearing:0,antialias:true});
MAP.addControl(new mapboxgl.NavigationControl({showCompass:true}),'top-right');
MAP.on('load',function(){
  MAP.addLayer({id:'3d-buildings',source:'composite','source-layer':'building',filter:['==','extrude','true'],type:'fill-extrusion',minzoom:13,paint:{
    'fill-extrusion-color':['interpolate',['linear'],['get','height'],0,'#e4ddd4',20,'#d8d0c6',50,'#ccc3b8',100,'#bfb5a9'],
    'fill-extrusion-height':['interpolate',['linear'],['zoom'],13,0,13.5,['get','height']],
    'fill-extrusion-base':['interpolate',['linear'],['zoom'],13,0,13.5,['get','min_height']],
    'fill-extrusion-opacity':0.85,
    'fill-extrusion-ambient-occlusion-intensity':0.4,
    'fill-extrusion-ambient-occlusion-radius':3.0,'fill-extrusion-cast-shadows':true
  }});
  updateLight();setTime(CRH);
  MAP.on('click',function(e){updPanel(e.lngLat.lat,e.lngLat.lng,'Valgt sted');loadNearby(e.lngLat.lat,e.lngLat.lng);MAP.flyTo({center:[e.lngLat.lng,e.lngLat.lat],zoom:Math.max(MAP.getZoom(),15),pitch:55,duration:600});});
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      function(pos){MAP.flyTo({center:[pos.coords.longitude,pos.coords.latitude],zoom:16,pitch:55,duration:1200});updPanel(pos.coords.latitude,pos.coords.longitude,'Din placering');loadNearby(pos.coords.latitude,pos.coords.longitude);},
      function(){MAP.flyTo({center:[12.568,55.676],zoom:15,pitch:55,duration:1200});updPanel(55.676,12.568,'København');loadNearby(55.676,12.568);}
    );
  }else{MAP.flyTo({center:[12.568,55.676],zoom:15,pitch:55,duration:1200});updPanel(55.676,12.568,'København');loadNearby(55.676,12.568);}
  document.getElementById('loading').classList.add('gone');
});
