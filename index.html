<script>
const DFT='e807bdf1dd535ce2356f498fc79bccaf';
function toRad(d){return d*Math.PI/180}function toDeg(r){return r*180/Math.PI}
function gsp(lat,lon,date){const jd=date.getTime()/86400000+2440587.5,n=jd-2451545,L=(280.46+0.9856474*n)%360,g=toRad(((357.528+0.9856003*n)%360+360)%360),lam=toRad(L+1.915*Math.sin(g)+.02*Math.sin(2*g)),eps=toRad(23.439-.0000004*n),sinDec=Math.sin(eps)*Math.sin(lam),cosDec=Math.cos(Math.asin(sinDec)),utcH=date.getUTCHours()+date.getUTCMinutes()/60+date.getUTCSeconds()/3600,lmst=((6.697375+0.0657098242*n+utcH+lon/15)%24+24)%24,ha=toRad((lmst-12)*15),latR=toRad(lat),sinAlt=Math.sin(latR)*sinDec+Math.cos(latR)*cosDec*Math.cos(ha),alt=toDeg(Math.asin(Math.max(-1,Math.min(1,sinAlt)))),cosAz=(sinDec-Math.sin(latR)*sinAlt)/(Math.cos(latR)*Math.cos(toRad(alt)));let az=toDeg(Math.acos(Math.max(-1,Math.min(1,cosAz))));if(Math.sin(ha)>0)az=360-az;return{alt,az}}
function grs(lat,lon,ds){let rise=null,set=null,prev=null;for(let m=0;m<=1440;m+=5){const d=new Date(ds+'T00:00:00Z');d.setUTCMinutes(d.getUTCMinutes()-60+m);const{alt}=gsp(lat,lon,d);if(prev!==null){if(prev<0&&alt>=0&&!rise)rise=m/60-.04;if(prev>=0&&alt<0&&!set)set=m/60-.04}prev=alt}return{rise,set}}
function sah(lat,lon,ds,h){const d=new Date(ds+'T00:00:00+01:00');d.setMinutes(d.getMinutes()+h*60);return gsp(lat,lon,d)}
function fmt(h){if(h===null)return'â';return String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round((h%1)*60)).padStart(2,'0')}
function azl(az){return['N','NNÃ','NÃ','ÃNÃ','Ã','ÃSÃ','SÃ','SSÃ','S','SSV','SV','VSV','V','VNV','NV','NNV'][Math.round(az/22.5)%16]}
const TODAY=new Date().toISOString().slice(0,10);
let gmap,gc,markers=[],slat=null,slon=null,isLive=true,curH=new Date().getHours()+new Date().getMinutes()/60;
let shadowLayer=null,showShadows=true;

function toast(msg,dur=2800){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur)}
function ts2(h){return String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round((h%1)*60)%60).padStart(2,'0')}
const tsl=document.getElementById('ts'),tdi=document.getElementById('tdis');
function setT(h){tsl.value=Math.round(h*60);tdi.textContent=ts2(h);tsl.style.setProperty('--p',(h/24*100).toFixed(1)+'%')}

// Shadow WMS layer from Dataforsyningen
function buildShadowUrl(dateStr,hour){
  const d=new Date(dateStr+'T'+String(Math.floor(hour)).padStart(2,'0')+':'+String(Math.round((hour%1)*60)%60).padStart(2,'0')+':00+01:00');
  const iso=d.toISOString();
  return `https://api.dataforsyningen.dk/dhm_skygge_3d?service=WMS&version=1.3.0&request=GetMap&layers=dhm_skygge_3d&styles=&CRS=EPSG:3857&width=256&height=256&format=image/png&transparent=true&time=${encodeURIComponent(iso)}&token=${DFT}`;
}

function updateShadowLayer(){
  if(!gmap)return;
  if(shadowLayer){shadowLayer.setMap(null);shadowLayer=null}
  if(!showShadows)return;
  const url=buildShadowUrl(TODAY,curH);
  shadowLayer=new google.maps.ImageMapType({
    getTileUrl:(coord,zoom)=>{
      const n=Math.pow(2,zoom);
      const lon1=coord.x/n*360-180;
      const lat1=toDeg(Math.atan(Math.sinh(Math.PI*(1-2*coord.y/n))));
      const lon2=(coord.x+1)/n*360-180;
      const lat2=toDeg(Math.atan(Math.sinh(Math.PI*(1-2*(coord.y+1)/n))));
      // Convert to EPSG:3857
      const toM=l=>l*20037508.34/180;
      const latToM=lat=>Math.log(Math.tan((90+lat)*Math.PI/360))/Math.PI*20037508.34;
      const minx=toM(lon1),miny=latToM(lat2),maxx=toM(lon2),maxy=latToM(lat1);
      return `https://api.dataforsyningen.dk/dhm_skygge_3d?service=WMS&version=1.3.0&request=GetMap&layers=dhm_skygge_3d&styles=&CRS=EPSG:3857&BBOX=${minx},${miny},${maxx},${maxy}&width=256&height=256&format=image/png&transparent=true&token=${DFT}`;
    },
    tileSize:new google.maps.Size(256,256),
    opacity:0.5,
    name:'Skygger'
  });
  gmap.overlayMapTypes.clear();
  gmap.overlayMapTypes.push(shadowLayer);
}

document.getElementById('shadow-toggle').addEventListener('click',()=>{
  showShadows=!showShadows;
  document.getElementById('shadow-toggle').classList.toggle('on',showShadows);
  updateShadowLayer();
  toast(showShadows?'ðï¸ Skygger slÃ¥et til':'ð Skygger slÃ¥et fra');
});

function drawArc(lat,lon,ch){
  const cv=document.getElementById('arc'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height,cx=W/2,cy=H-10,r=Math.min(cx-14,H-18);
  ctx.clearRect(0,0,W,H);
  ctx.beginPath();ctx.moveTo(10,cy);ctx.lineTo(W-10,cy);ctx.strokeStyle='#D0D8E4';ctx.lineWidth=1.5;ctx.stroke();
  const pts=[];
  for(let h=0;h<=24;h+=.2){const{alt,az}=sah(lat,lon,TODAY,h);if(alt>0){const ang=Math.PI-(az/180)*Math.PI,rr=r*(1-alt/90);pts.push({x:cx+rr*Math.cos(ang),y:cy-r*(alt/90)})}}
  if(pts.length>1){
    const g=ctx.createLinearGradient(0,0,0,cy);g.addColorStop(0,'rgba(245,166,35,.2)');g.addColorStop(1,'rgba(245,166,35,0)');
    ctx.beginPath();ctx.moveTo(pts[0].x,cy);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(pts[pts.length-1].x,cy);ctx.closePath();ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.strokeStyle='#F5A623';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
  }
  const{alt,az}=sah(lat,lon,TODAY,ch);
  if(alt>0){const ang=Math.PI-(az/180)*Math.PI,rr=r*(1-alt/90),sx=cx+rr*Math.cos(ang),sy=cy-r*(alt/90);ctx.beginPath();ctx.arc(sx,sy,7,0,2*Math.PI);ctx.fillStyle='#F5A623';ctx.shadowColor='rgba(245,166,35,.6)';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0}
}

function upPanel(lat,lon,name,sub){
  slat=lat;slon=lon;
  document.getElementById('pn').textContent=name||'Valgt sted';
  document.getElementById('ps').textContent=sub||lat.toFixed(4)+', '+lon.toFixed(4);
  const now=new Date(TODAY+'T'+ts2(curH)+':00+01:00');
  const{alt,az}=gsp(lat,lon,now);
  const{rise,set}=grs(lat,lon,TODAY);
  const hasSun=alt>3;
  const ind=document.getElementById('si2');ind.style.display='flex';
  ind.className='sind '+(hasSun?'sun':'shade');
  document.getElementById('sic').textContent=hasSun?'âï¸':(alt>0?'ðï¸':'ð');
  document.getElementById('sit').textContent=hasSun?'Sol pÃ¥ stedet':(alt>0?'Lavt sol/mulig skygge':'Ingen sol nu');
  document.getElementById('sis').textContent=hasSun?'Solen er '+alt.toFixed(1)+'Â° oppe fra '+azl(az):(alt>0?'Tjek skyggekort pÃ¥ kortet':'Solopgang: '+fmt(rise));
  const qb=document.getElementById('qb');qb.style.display='inline-flex';
  qb.className='qbadge '+(showShadows?'dhm':'ast');
  qb.textContent=showShadows?'ðï¸ DHM Skyggekort aktivt':'â Astronomisk beregning';
  document.getElementById('sr').textContent=fmt(rise);
  document.getElementById('ss').textContent=fmt(set);
  document.getElementById('sa').innerHTML=alt.toFixed(1)+'<span class="sunit">Â°</span>';
  document.getElementById('saz').textContent=azl(az);
  drawArc(lat,lon,curH);
  document.getElementById('hint').style.display='none';
  document.getElementById('ds').style.display='block';
}

function mkI(s){return{path:google.maps.SymbolPath.CIRCLE,scale:10,fillColor:s?'#F5A623':'#8A9BB0',fillOpacity:1,strokeColor:'white',strokeWeight:2.5}}
function refMk(){markers.forEach(m=>{const{alt}=sah(m._lat,m._lon,TODAY,curH);m.setIcon(mkI(alt>3))})}

async function searchNearby(lat,lng){
  markers.forEach(m=>m.setMap(null));markers=[];
  document.getElementById('pl').innerHTML='';
  document.getElementById('nbt').style.display='none';
  try{
    const{Place}=await google.maps.importLibrary('places');
    const types=['cafe','restaurant','bar'],tl={cafe:'CafÃ©',restaurant:'Restaurant',bar:'Bar'},seen=new Set(),all=[];
    for(const type of types){
      try{const{places}=await Place.searchNearby({fields:['displayName','location','formattedAddress'],locationRestriction:{center:{lat,lng},radius:600},includedPrimaryTypes:[type],maxResultCount:6});
      if(places)places.forEach(p=>{if(seen.has(p.displayName))return;seen.add(p.displayName);all.push({name:p.displayName,address:p.formattedAddress,lat:p.location.lat(),lng:p.location.lng(),type:tl[type]})})}catch(e){}
    }
    const list=document.getElementById('pl');let suns=0;
    for(const p of all){
      const{alt}=sah(p.lat,p.lng,TODAY,curH),hs=alt>3;if(hs)suns++;
      const m=new google.maps.Marker({position:{lat:p.lat,lng:p.lng},map:gmap,title:p.name,icon:mkI(hs)});
      m._lat=p.lat;m._lon=p.lng;markers.push(m);
      m.addListener('click',()=>{upPanel(p.lat,p.lng,p.name,p.type+(p.address?' Â· '+p.address.split(',')[0]:''))});
      const btn=document.createElement('button');
      btn.className='pitem'+(hs?' snow':'');
      btn.innerHTML='<div class="pdot '+(hs?'sun':'shade')+'"></div><div class="pinfo"><div class="pname2">'+p.name+'</div><div class="ptype">'+p.type+'</div></div><div class="psun '+(hs?'sun':'shade')+'">'+(hs?'âï¸ Sol nu':'ð Skygge')+'</div>';
      btn.addEventListener('click',()=>{gmap.panTo({lat:p.lat,lng:p.lng});upPanel(p.lat,p.lng,p.name,p.type+(p.address?' Â· '+p.address.split(',')[0]:''))});
      list.appendChild(btn);
    }
    if(all.length){document.getElementById('nbt').style.display='block';toast('âï¸ '+suns+' i sol  Â·  ð '+(all.length-suns)+' i skygge')}
    else toast('Ingen steder fundet i nÃ¦rheden');
  }catch(e){toast('Fejl: '+e.message)}
}

function initMap(){
  gmap=new google.maps.Map(document.getElementById('map'),{
    center:{lat:55.676,lng:12.568},zoom:14,
    styles:[{featureType:'all',elementType:'geometry',stylers:[{color:'#F2EDE6'}]},{featureType:'water',elementType:'geometry',stylers:[{color:'#C8DDEF'}]},{featureType:'road',elementType:'geometry',stylers:[{color:'#FFF'}]},{featureType:'road.arterial',elementType:'geometry',stylers:[{color:'#FAE5C8'}]},{featureType:'road.highway',elementType:'geometry',stylers:[{color:'#F5D5A8'}]},{featureType:'park',elementType:'geometry',stylers:[{color:'#D5EDBD'}]},{featureType:'poi',elementType:'labels',stylers:[{visibility:'off'}]},{featureType:'transit',elementType:'labels',stylers:[{visibility:'off'}]},{elementType:'labels.text.fill',stylers:[{color:'#7A6A58'}]},{elementType:'labels.text.stroke',stylers:[{color:'#FAFAF8',weight:2}]}],
    disableDefaultUI:true,zoomControl:true,zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_CENTER},clickableIcons:false
  });
  gc=new google.maps.Geocoder();
  updateShadowLayer();
  gmap.addListener('click',e=>{const lat=e.latLng.lat(),lng=e.latLng.lng();upPanel(lat,lng);searchNearby(lat,lng)});
  document.getElementById('sb').addEventListener('click',doSearch);
  document.getElementById('si').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
  if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{gmap.setCenter({lat:p.coords.latitude,lng:p.coords.longitude});upPanel(p.coords.latitude,p.coords.longitude,'Din placering','GPS');searchNearby(p.coords.latitude,p.coords.longitude)},()=>searchNearby(55.676,12.568))}
  else searchNearby(55.676,12.568);
  document.getElementById('loading').classList.add('hidden');
};

function doSearch(){const q=document.getElementById('si').value.trim();if(!q)return;gc.geocode({address:q.includes(',')?q:q+', Danmark'},(r,s)=>{if(s==='OK'&&r[0]){const loc=r[0].geometry.location;gmap.setCenter(loc);gmap.setZoom(15);upPanel(loc.lat(),loc.lng(),r[0].formatted_address.split(',')[0],r[0].formatted_address);searchNearby(loc.lat(),loc.lng())}else toast('Adresse ikke fundet')})}

tsl.addEventListener('input',()=>{curH=parseInt(tsl.value)/60;tdi.textContent=ts2(curH);tsl.style.setProperty('--p',(curH/24*100).toFixed(1)+'%');isLive=false;document.getElementById('lb').classList.remove('on');refMk();updateShadowLayer();if(slat!==null)upPanel(slat,slon,document.getElementById('pn').textContent,document.getElementById('ps').textContent)});
document.getElementById('lb').addEventListener('click',()=>{isLive=!isLive;document.getElementById('lb').classList.toggle('on',isLive);if(isLive)syncL()});
function syncL(){if(!isLive)return;const n=new Date();curH=n.getHours()+n.getMinutes()/60;setT(curH);refMk();updateShadowLayer();if(slat!==null)upPanel(slat,slon,document.getElementById('pn').textContent,document.getElementById('ps').textContent)}
setInterval(()=>{if(isLive)syncL()},60000);
setT(curH);

</script>
