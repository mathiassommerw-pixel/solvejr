<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solvejr — Find sol i Danmark</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--sun:#F5A623;--warm:#E8863A;--pale:#FFF3DC;--bg:#FAFAF8;--txt:#1A2332;--mut:#6B7A8D;--bdr:rgba(27,35,50,0.08);--lt:#E8EEF5;--pw:380px;--bh:64px}
html,body{height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt)}
#bar{position:fixed;top:0;left:0;right:0;height:var(--bh);background:var(--bg);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:14px;padding:0 20px;z-index:1000;box-shadow:0 1px 24px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
.logo-sun{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE08A,var(--sun));box-shadow:0 0 0 4px rgba(245,166,35,.15);animation:glow 3s ease-in-out infinite;flex-shrink:0}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px rgba(245,166,35,.15)}50%{box-shadow:0 0 0 8px rgba(245,166,35,.08)}}
.logo-name{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:var(--txt);letter-spacing:-.5px}
.logo-name em{color:var(--sun);font-style:normal}
#srch{flex:1;max-width:460px;display:flex;align-items:center;background:var(--lt);border-radius:50px;padding:0 6px 0 18px;gap:8px;border:1.5px solid transparent;transition:.2s}
#srch:focus-within{background:#fff;border-color:var(--sun);box-shadow:0 0 0 3px rgba(245,166,35,.12)}
#sinp{flex:1;border:none;outline:none;background:transparent;font-family:'Outfit',sans-serif;font-size:.92rem;color:var(--txt);padding:10px 0}
#sinp::placeholder{color:var(--mut)}
#sbtn{background:var(--sun);border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#sbtn svg{width:15px;height:15px;fill:#fff}
#tc{display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--lt);border-radius:50px;padding:6px 16px 6px 12px}
.tlbl{font-size:.7rem;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
#tdis{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--txt);min-width:3.2rem;text-align:center}
#tsl{width:100px;-webkit-appearance:none;height:3px;border-radius:2px;background:linear-gradient(to right,var(--sun) var(--p,50%),#D0D8E4 var(--p,50%));outline:none;cursor:pointer}
#tsl::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--sun);border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#lbtn{display:flex;align-items:center;gap:6px;flex-shrink:0;padding:7px 14px;border-radius:50px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;font-size:.78rem;font-weight:600;background:var(--lt);color:var(--mut);transition:.2s}
#lbtn.on{background:var(--sun);color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#map{position:fixed;top:var(--bh);left:0;right:var(--pw);bottom:0}
#panel{position:fixed;top:var(--bh);right:0;bottom:0;width:var(--pw);background:var(--bg);border-left:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
#ptop{padding:20px 20px 14px;border-bottom:1px solid var(--bdr);background:#fff}
.pname{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--txt);line-height:1.2;margin-bottom:3px}
.psub{font-size:.78rem;color:var(--mut)}
.sind{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 13px;border-radius:12px;border:1.5px solid;transition:.4s}
.sind.sun{background:var(--pale);border-color:rgba(245,166,35,.3);color:#8B5E00}
.sind.shade{background:#EDF0F5;border-color:rgba(43,58,78,.15);color:#4A5568}
.sind-ico{font-size:1.3rem}.sind-txt{flex:1}.sind-ttl{font-weight:600;font-size:.88rem}.sind-sub{font-size:.73rem;opacity:.7;margin-top:1px}
.badge{display:inline-flex;align-items:center;gap:4px;margin-top:7px;padding:3px 10px;border-radius:50px;font-size:.68rem;font-weight:600;text-transform:uppercase;background:#E3F2FD;color:#1565C0}
#pbody{flex:1;overflow-y:auto;padding:18px 20px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
.scard{background:var(--lt);border-radius:12px;padding:12px;border:1px solid var(--bdr)}
.slbl{font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:3px}
.sval{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--txt)}
.sunit{font-family:'Outfit',sans-serif;font-size:.72rem;color:var(--mut)}
.sectitle{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:8px}
.arcbox{background:var(--lt);border-radius:14px;padding:11px;margin-bottom:18px}
.plist{display:flex;flex-direction:column;gap:7px}
.pitem{display:flex;align-items:center;gap:11px;padding:11px 13px;background:#fff;border:1.5px solid var(--bdr);border-radius:12px;cursor:pointer;transition:.2s;text-align:left;width:100%}
.pitem:hover{border-color:var(--sun);box-shadow:0 4px 16px rgba(245,166,35,.1);transform:translateY(-1px)}
.pitem.snow{border-color:rgba(245,166,35,.4);background:#FFFBF2}
.pdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pdot.sun{background:var(--sun)}.pdot.shade{background:#A0AEC0}
.pinfo{flex:1;min-width:0}
.pn2{font-weight:600;font-size:.86rem;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptyp{font-size:.71rem;color:var(--mut);margin-top:1px}
.psun2{font-size:.73rem;font-weight:600}.psun2.sun{color:var(--warm)}.psun2.shade{color:#90A0B0}
.hint{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1.5rem;text-align:center;height:100%}
.hi{font-size:2.8rem;margin-bottom:1rem;opacity:.35}
.ht{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--mut);margin-bottom:.4rem}
.hx{font-size:.8rem;color:var(--mut);line-height:1.6;opacity:.7}
#toast{position:fixed;bottom:22px;left:calc(50% - var(--pw)/2);transform:translateX(-50%) translateY(8px);background:var(--txt);color:#fff;padding:9px 18px;border-radius:50px;font-size:.8rem;font-weight:500;z-index:9999;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#loading{position:fixed;inset:0;background:rgba(250,250,248,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2000;backdrop-filter:blur(4px);transition:opacity .4s}
#loading.hidden{opacity:0;pointer-events:none}
.lsun{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE08A,var(--sun));animation:lg 2s ease-in-out infinite;margin-bottom:18px}
@keyframes lg{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.ltxt{font-family:'Playfair Display',serif;font-size:1rem;color:var(--mut)}
</style>
</head>
<body>
<div id="loading"><div class="lsun"></div><div class="ltxt">Indlæser Solvejr…</div></div>
<div id="bar">
  <a class="logo" href="#"><div class="logo-sun"></div><div class="logo-name">Sol<em>vejr</em></div></a>
  <div id="srch">
    <svg style="width:15px;height:15px;fill:var(--mut);flex-shrink:0" viewBox="0 0 20 20"><path d="M8.5 3a5.5 5.5 0 1 0 3.516 9.723l3.63 3.63a.75.75 0 1 0 1.061-1.06l-3.63-3.631A5.5 5.5 0 0 0 8.5 3zm-4 5.5a4 4 0 1 1 8 0 4 4 0 0 1-8 0z"/></svg>
    <input type="text" id="sinp" placeholder="Søg adresse, café eller restaurant…" autocomplete="off">
    <button id="sbtn"><svg viewBox="0 0 20 20"><path d="M8.5 3a5.5 5.5 0 1 0 3.516 9.723l3.63 3.63a.75.75 0 1 0 1.061-1.06l-3.63-3.631A5.5 5.5 0 0 0 8.5 3zm-4 5.5a4 4 0 1 1 8 0 4 4 0 0 1-8 0z"/></svg></button>
  </div>
  <div id="tc"><div class="tlbl">Tid</div><div id="tdis">12:00</div><input type="range" id="tsl" min="0" max="1440" value="720" step="5"></div>
  <button id="lbtn" class="on"><span class="dot"></span> Live</button>
</div>
<div id="map"></div>
<div id="panel">
  <div id="ptop">
    <div class="pname" id="pn">Solvejr</div>
    <div class="psub" id="ps">Find sol i Danmark</div>
    <div id="sind" class="sind shade" style="display:none">
      <div class="sind-ico" id="sico">🌙</div>
      <div class="sind-txt"><div class="sind-ttl" id="sttl">Ingen sol</div><div class="sind-sub" id="ssub"></div></div>
    </div>
    <div id="badge" class="badge" style="display:none">🏗️ DHM Skyggekort aktivt</div>
  </div>
  <div id="pbody">
    <div class="hint" id="hint"><div class="hi">🌞</div><div class="ht">Søg en adresse</div><div class="hx">Find caféer og restauranter med sol — eller planlæg fremad med tidslinjen</div></div>
    <div id="ds" style="display:none">
      <div class="sgrid">
        <div class="scard"><div class="slbl">Solopgang</div><div class="sval" id="sr">—</div></div>
        <div class="scard"><div class="slbl">Solnedgang</div><div class="sval" id="ss">—</div></div>
        <div class="scard"><div class="slbl">Solhøjde</div><div class="sval" id="sa">—<span class="sunit">°</span></div></div>
        <div class="scard"><div class="slbl">Retning</div><div class="sval" id="saz">—</div></div>
      </div>
      <div class="sectitle">Solbane i dag</div>
      <div class="arcbox"><canvas id="arc" width="310" height="120"></canvas></div>
      <div class="sectitle" id="nbt" style="display:none">Steder i nærheden</div>
      <div class="plist" id="pl"></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
var GM,GC,MK=[],SLA=null,SLO=null,LIV=true,SHL=null;
var CRH=new Date().getHours()+new Date().getMinutes()/60;
var TOD=new Date().toISOString().slice(0,10);
var DFT='e807bdf1dd535ce2356f498fc79bccaf';
function rad(d){return d*Math.PI/180}function deg(r){return r*180/Math.PI}
function sol(lat,lon,dt){var jd=dt.getTime()/86400000+2440587.5,n=jd-2451545,L=(280.46+0.9856474*n)%360;var g=rad(((357.528+0.9856003*n)%360+360)%360),lam=rad(L+1.915*Math.sin(g)+.02*Math.sin(2*g));var eps=rad(23.439-.0000004*n),sd=Math.sin(eps)*Math.sin(lam),cd=Math.cos(Math.asin(sd));var uh=dt.getUTCHours()+dt.getUTCMinutes()/60+dt.getUTCSeconds()/3600;var lst=((6.697375+0.0657098242*n+uh+lon/15)%24+24)%24,ha=rad((lst-12)*15),lr=rad(lat);var sa=Math.sin(lr)*sd+Math.cos(lr)*cd*Math.cos(ha),alt=deg(Math.asin(Math.max(-1,Math.min(1,sa))));var ca=(sd-Math.sin(lr)*sa)/(Math.cos(lr)*Math.cos(rad(alt))),az=deg(Math.acos(Math.max(-1,Math.min(1,ca))));if(Math.sin(ha)>0)az=360-az;return{alt:alt,az:az}}
function rs(lat,lon,ds){var ri=null,se=null,pv=null;for(var m=0;m<=1440;m+=5){var d=new Date(ds+'T00:00:00Z');d.setUTCMinutes(d.getUTCMinutes()-60+m);var a=sol(lat,lon,d).alt;if(pv!==null){if(pv<0&&a>=0&&!ri)ri=m/60-.04;if(pv>=0&&a<0&&!se)se=m/60-.04}pv=a}return{ri:ri,se:se}}
function sh(lat,lon,h){var d=new Date(TOD+'T00:00:00+01:00');d.setMinutes(d.getMinutes()+h*60);return sol(lat,lon,d)}
function ft(h){if(h===null)return'—';return String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round((h%1)*60)).padStart(2,'0')}
function azl(a){return['N','NNØ','NØ','ØNØ','Ø','ØSØ','SØ','SSØ','S','SSV','SV','VSV','V','VNV','NV','NNV'][Math.round(a/22.5)%16]}
function ts(h){return String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round((h%1)*60)%60).padStart(2,'0')}
function tst(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2800)}
var tsl=document.getElementById('tsl'),tdi=document.getElementById('tdis');
function setT(h){tsl.value=Math.round(h*60);tdi.textContent=ts(h);tsl.style.setProperty('--p',(h/24*100).toFixed(1)+'%')}
tsl.addEventListener('input',function(){CRH=parseInt(tsl.value)/60;tdi.textContent=ts(CRH);tsl.style.setProperty('--p',(CRH/24*100).toFixed(1)+'%');LIV=false;document.getElementById('lbtn').classList.remove('on');rfmk();updSh();if(SLA!==null)upP(SLA,SLO,document.getElementById('pn').textContent,document.getElementById('ps').textContent)});
document.getElementById('lbtn').addEventListener('click',function(){LIV=!LIV;document.getElementById('lbtn').classList.toggle('on',LIV);if(LIV)sL()});
function sL(){if(!LIV)return;var n=new Date();CRH=n.getHours()+n.getMinutes()/60;setT(CRH);rfmk();updSh();if(SLA!==null)upP(SLA,SLO,document.getElementById('pn').textContent,document.getElementById('ps').textContent)}
setInterval(function(){if(LIV)sL()},60000);setT(CRH);
function updSh(){if(!GM)return;if(SHL){GM.overlayMapTypes.clear();SHL=null}var dft=DFT;SHL=new google.maps.ImageMapType({getTileUrl:function(c,z){var n=Math.pow(2,z),tM=function(l){return l*20037508.34/180},lM=function(l){return Math.log(Math.tan((90+l)*Math.PI/360))/Math.PI*20037508.34};var x1=c.x/n*360-180,y1=deg(Math.atan(Math.sinh(Math.PI*(1-2*c.y/n)))),x2=(c.x+1)/n*360-180,y2=deg(Math.atan(Math.sinh(Math.PI*(1-2*(c.y+1)/n))));return 'https://api.dataforsyningen.dk/dhm_skygge_3d?service=WMS&version=1.3.0&request=GetMap&layers=dhm_skygge_3d&styles=&CRS=EPSG:3857&BBOX='+tM(x1)+','+lM(y2)+','+tM(x2)+','+lM(y1)+'&width=256&height=256&format=image/png&transparent=true&token='+dft},tileSize:new google.maps.Size(256,256),opacity:0.5});GM.overlayMapTypes.push(SHL)}
function drawArc(lat,lon,ch){var cv=document.getElementById('arc'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height,cx=W/2,cy=H-10,r=Math.min(cx-14,H-18);ctx.clearRect(0,0,W,H);ctx.beginPath();ctx.moveTo(10,cy);ctx.lineTo(W-10,cy);ctx.strokeStyle='#D0D8E4';ctx.lineWidth=1.5;ctx.stroke();var pts=[];for(var h=0;h<=24;h+=.2){var p=sh(lat,lon,h);if(p.alt>0){var ag=Math.PI-(p.az/180)*Math.PI,rr=r*(1-p.alt/90);pts.push({x:cx+rr*Math.cos(ag),y:cy-r*(p.alt/90)})}}if(pts.length>1){var g=ctx.createLinearGradient(0,0,0,cy);g.addColorStop(0,'rgba(245,166,35,.2)');g.addColorStop(1,'rgba(245,166,35,0)');ctx.beginPath();ctx.moveTo(pts[0].x,cy);pts.forEach(function(p){ctx.lineTo(p.x,p.y)});ctx.lineTo(pts[pts.length-1].x,cy);ctx.closePath();ctx.fillStyle=g;ctx.fill();ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.forEach(function(p){ctx.lineTo(p.x,p.y)});ctx.strokeStyle='#F5A623';ctx.lineWidth=2.5;ctx.stroke()}var cp=sh(lat,lon,ch);if(cp.alt>0){var ag2=Math.PI-(cp.az/180)*Math.PI,rr2=r*(1-cp.alt/90);ctx.beginPath();ctx.arc(cx+rr2*Math.cos(ag2),cy-r*(cp.alt/90),7,0,2*Math.PI);ctx.fillStyle='#F5A623';ctx.shadowColor='rgba(245,166,35,.6)';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0}}
function upP(lat,lon,nm,sb){SLA=lat;SLO=lon;document.getElementById('pn').textContent=nm||'Valgt sted';document.getElementById('ps').textContent=sb||lat.toFixed(4)+', '+lon.toFixed(4);var now=new Date(TOD+'T'+ts(CRH)+':00+01:00'),p=sol(lat,lon,now),r2=rs(lat,lon,TOD),hs=p.alt>3;var ind=document.getElementById('sind');ind.style.display='flex';ind.className='sind '+(hs?'sun':'shade');document.getElementById('sico').textContent=hs?'☀️':(p.alt>0?'🏙️':'🌙');document.getElementById('sttl').textContent=hs?'Sol på stedet':(p.alt>0?'Mulig skygge':'Ingen sol nu');document.getElementById('ssub').textContent=hs?'Solen er '+p.alt.toFixed(1)+'° fra '+azl(p.az):(p.alt>0?'Tjek skyggekort':'Solopgang: '+ft(r2.ri));document.getElementById('badge').style.display='inline-flex';document.getElementById('sr').textContent=ft(r2.ri);document.getElementById('ss').textContent=ft(r2.se);document.getElementById('sa').innerHTML=p.alt.toFixed(1)+'<span class="sunit">°</span>';document.getElementById('saz').textContent=azl(p.az);drawArc(lat,lon,CRH);document.getElementById('hint').style.display='none';document.getElementById('ds').style.display='block'}
function mki(s){return{path:google.maps.SymbolPath.CIRCLE,scale:10,fillColor:s?'#F5A623':'#8A9BB0',fillOpacity:1,strokeColor:'#fff',strokeWeight:2.5}}
function rfmk(){MK.forEach(function(m){m.setIcon(mki(sh(m._a,m._o,CRH).alt>3))})}
function near(lat,lng){MK.forEach(function(m){m.setMap(null)});MK=[];document.getElementById('pl').innerHTML='';document.getElementById('nbt').style.display='none';var svc=new google.maps.places.PlacesService(GM);var tp=['cafe','restaurant','bar'],tl={cafe:'Café',restaurant:'Restaurant',bar:'Bar'},al=[],dn=0;tp.forEach(function(t){svc.nearbySearch({location:{lat:lat,lng:lng},radius:600,type:t},function(res,status){if(status==='OK'&&res)res.forEach(function(p){if(al.find(function(x){return x.n===p.name}))return;al.push({n:p.name,la:p.geometry.location.lat(),ln:p.geometry.location.lng(),t:tl[t]})});dn++;if(dn===tp.length){var li=document.getElementById('pl'),sc=0;al.forEach(function(p){var hs=sh(p.la,p.ln,CRH).alt>3;if(hs)sc++;var m=new google.maps.Marker({position:{lat:p.la,lng:p.ln},map:GM,title:p.n,icon:mki(hs)});m._a=p.la;m._o=p.ln;MK.push(m);m.addListener('click',function(){upP(p.la,p.ln,p.n,p.t)});var b=document.createElement('button');b.className='pitem'+(hs?' snow':'');b.innerHTML='<div class="pdot '+(hs?'sun':'shade')+'"></div><div class="pinfo"><div class="pn2">'+p.n+'</div><div class="ptyp">'+p.t+'</div></div><div class="psun2 '+(hs?'sun':'shade')+'">'+(hs?'☀️ Sol nu':'🌙 Skygge')+'</div>';b.addEventListener('click',function(){GM.panTo({lat:p.la,lng:p.ln});upP(p.la,p.ln,p.n,p.t)});li.appendChild(b)});if(al.length){document.getElementById('nbt').style.display='block';tst('☀️ '+sc+' i sol  ·  🌙 '+(al.length-sc)+' i skygge')}else tst('Ingen steder fundet')}})})}
window.initMap=function(){
  if(window._mi)return;window._mi=true;
  GM=new google.maps.Map(document.getElementById('map'),{
    center:{lat:55.676,lng:12.568},zoom:14,
    mapId:'DEMO_MAP_ID',
    disableDefaultUI:true,zoomControl:true,
    zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_CENTER},
    clickableIcons:false
  });
  GC=new google.maps.Geocoder();
  updSh();
  GM.addListener('click',function(e){var la=e.latLng.lat(),ln=e.latLng.lng();upP(la,ln);near(la,ln)});
  document.getElementById('sbtn').addEventListener('click',srch);
  document.getElementById('sinp').addEventListener('keydown',function(e){if(e.key==='Enter')srch()});
  if(navigator.geolocation){navigator.geolocation.getCurrentPosition(function(p){GM.setCenter({lat:p.coords.latitude,lng:p.coords.longitude});upP(p.coords.latitude,p.coords.longitude,'Din placering','GPS');near(p.coords.latitude,p.coords.longitude)},function(){near(55.676,12.568)})}
  else near(55.676,12.568);
  document.getElementById('loading').classList.add('hidden');
}
function srch(){var q=document.getElementById('sinp').value.trim();if(!q)return;GC.geocode({address:q.includes(',')?q:q+', Danmark'},function(r,s){if(s==='OK'&&r[0]){var l=r[0].geometry.location;GM.setCenter(l);GM.setZoom(15);upP(l.lat(),l.lng(),r[0].formatted_address.split(',')[0],r[0].formatted_address);near(l.lat(),l.lng())}else tst('Adresse ikke fundet')})}
