<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Solvejr — Find sol i Danmark</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--sun:#F5A623;--warm:#E8863A;--pale:#FFF3DC;--bg:#FAFAF8;--txt:#1A2332;--mut:#6B7A8D;--bdr:rgba(27,35,50,.09);--lt:#EEF1F6;--pw:370px;--bh:60px}
html,body{height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt)}
#bar{position:fixed;top:0;left:0;right:0;height:var(--bh);background:#fff;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:1000;box-shadow:0 1px 12px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:8px;flex-shrink:0;text-decoration:none}
.logo-sun{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE08A,#F5A623);box-shadow:0 0 0 5px rgba(245,166,35,.13);animation:glow 3s ease-in-out infinite;flex-shrink:0}
@keyframes glow{0%,100%{box-shadow:0 0 0 5px rgba(245,166,35,.13)}50%{box-shadow:0 0 0 9px rgba(245,166,35,.06)}}
.logo-name{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;color:var(--txt)}.logo-name em{color:var(--sun);font-style:normal}
#sw{flex:1;max-width:420px;position:relative}
#srch{display:flex;align-items:center;background:var(--lt);border-radius:50px;padding:0 5px 0 14px;gap:8px;border:1.5px solid transparent;transition:.2s}
#srch:focus-within{background:#fff;border-color:var(--sun);box-shadow:0 0 0 3px rgba(245,166,35,.1)}
#sinp{flex:1;border:none;outline:none;background:transparent;font-family:'Outfit',sans-serif;font-size:.86rem;color:var(--txt);padding:9px 0;min-width:0}
#sinp::placeholder{color:var(--mut)}
#sbtn{background:var(--sun);border:none;border-radius:50%;width:29px;height:29px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#sbtn svg{width:12px;height:12px;fill:#fff}
#sug{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.13);overflow:hidden;z-index:9999;display:none}
.si{padding:10px 15px;cursor:pointer;border-bottom:1px solid var(--bdr);transition:background .1s}.si:last-child{border-bottom:none}.si:hover,.si:active{background:var(--lt)}
.si-m{font-weight:600;font-size:.83rem}.si-s{font-size:.73rem;color:var(--mut);margin-top:1px}
#tc{display:flex;align-items:center;gap:9px;background:var(--lt);border-radius:50px;padding:5px 13px 5px 11px;flex-shrink:0}
.tlbl{font-size:.62rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
#tdis{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--txt);min-width:2.6rem;text-align:center}
#tsl{width:86px;-webkit-appearance:none;height:3px;border-radius:2px;background:linear-gradient(to right,var(--sun) var(--p,50%),#C8D1DC var(--p,50%));outline:none;cursor:pointer}
#tsl::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--sun);border:2.5px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.2)}
#lbtn{padding:5px 12px;border-radius:50px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;font-size:.73rem;font-weight:600;display:flex;align-items:center;gap:5px;background:var(--lt);color:var(--mut);transition:.2s;flex-shrink:0}
#lbtn.on{background:var(--sun);color:#fff}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#map{position:fixed;top:var(--bh);left:0;right:var(--pw);bottom:0}
/* Skyggekortet zoomer ikke ind over 16 */
#panel{position:fixed;top:var(--bh);right:0;bottom:0;width:var(--pw);background:var(--bg);border-left:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
#ptop{padding:16px 18px 14px;border-bottom:1px solid var(--bdr);background:#fff;flex-shrink:0}
.pname{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;line-height:1.2}
.psub{font-size:.74rem;color:var(--mut);margin-top:2px}
.sind{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 12px;border-radius:11px;border:1.5px solid}
.sind.sun{background:var(--pale);border-color:rgba(245,166,35,.35);color:#7A5100}
.sind.shade{background:#EDF0F5;border-color:rgba(0,0,0,.08);color:#4A5568}
.sind-ico{font-size:1.2rem}.sind-ttl{font-weight:600;font-size:.83rem}.sind-sub{font-size:.69rem;opacity:.7;margin-top:1px}
#pbody{flex:1;overflow-y:auto;padding:14px 16px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.scard{background:var(--lt);border-radius:10px;padding:10px}
.slbl{font-size:.61rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:2px}
.sval{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700}
.sunit{font-family:'Outfit',sans-serif;font-size:.68rem;color:var(--mut)}
.sectit{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:7px}
.arcbox{background:var(--lt);border-radius:12px;padding:9px;margin-bottom:14px}
.plist{display:flex;flex-direction:column;gap:6px}
.pitem{display:flex;align-items:center;background:#fff;border:1.5px solid var(--bdr);border-radius:11px;cursor:pointer;transition:.18s;text-align:left;width:100%;overflow:hidden}
.pitem:hover{border-color:var(--sun);box-shadow:0 3px 12px rgba(245,166,35,.1);transform:translateY(-1px)}
.pitem.snow{border-color:rgba(245,166,35,.35);background:#FFFBF2}
.pimg{width:60px;height:60px;object-fit:cover;flex-shrink:0}
.pimg-ph{width:60px;height:60px;background:var(--lt);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.pinner{flex:1;min-width:0;padding:9px 11px;display:flex;align-items:center;gap:7px}
.pdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.pdot.sun{background:var(--sun)}.pdot.shade{background:#A0AEC0}
.pinfo{flex:1;min-width:0}
.pn2{font-weight:600;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptyp{font-size:.68rem;color:var(--mut);margin-top:1px}
.pmeta{font-size:.68rem;color:var(--mut);margin-top:2px}
.prat{color:var(--warm);font-weight:600}
.psun2{font-size:.68rem;font-weight:600;text-align:center;flex-shrink:0;line-height:1.4}
.psun2.sun{color:var(--warm)}.psun2.shade{color:#90A0B0}
.hint{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 1.5rem;text-align:center;height:100%;gap:.7rem}
.hi{font-size:2.2rem;opacity:.3}.ht{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--mut)}
.hx{font-size:.76rem;color:var(--mut);line-height:1.6;opacity:.7}
/* Detail panel */
#dpanel{position:fixed;top:var(--bh);right:var(--pw);bottom:0;width:320px;background:#fff;border-left:1px solid var(--bdr);border-right:1px solid var(--bdr);display:none;flex-direction:column;z-index:10;box-shadow:-4px 0 20px rgba(0,0,0,.08);overflow:hidden}
#dpanel.open{display:flex}

#dpcl{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:var(--lt);border:none;cursor:pointer;font-size:.9rem;color:var(--mut);z-index:4;display:flex;align-items:center;justify-content:center}
#dpbody{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.d-gal-wrap{position:relative;margin-bottom:12px}
.d-gal-wrap .d-gal{margin-bottom:0}
.gal-arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;background:rgba(255,255,255,.92);border:none;border-radius:50%;cursor:pointer;font-size:1.2rem;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:5;color:#1A2332;transition:transform .15s,background .15s;line-height:1}
.gal-arrow:hover{background:#fff;transform:translateY(-50%) scale(1.1)}
.gal-arrow.prev{left:10px}
.gal-arrow.next{right:10px}
.d-gal{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.d-gal::-webkit-scrollbar{display:none}
.d-gal img{height:140px;width:auto;border-radius:10px;flex-shrink:0;object-fit:cover}
.d-gal img:first-child{width:100%;height:175px;border-radius:0;object-fit:cover}
.d-pad{padding:0 16px 20px}
.d-name{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;line-height:1.2;margin-bottom:3px}
.d-addr{font-size:.74rem;color:var(--mut);margin-bottom:8px}
.d-open{color:#2E7D32;font-weight:600;font-size:.76rem;margin-bottom:8px}
.d-closed{color:#C62828;font-weight:600;font-size:.76rem;margin-bottom:8px}
.d-links{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.d-links a{font-size:.76rem;color:var(--sun);font-weight:600;text-decoration:none}
.d-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.d-chip{padding:4px 11px;border-radius:50px;font-size:.72rem;font-weight:500;background:var(--lt)}
.d-chip.sun{background:var(--pale);color:#8B5E00}
.d-sind{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;border:1.5px solid;margin-bottom:12px}
.d-sind.sun{background:var(--pale);border-color:rgba(245,166,35,.35);color:#7A5100}
.d-sind.shade{background:#EDF0F5;border-color:rgba(0,0,0,.08);color:#4A5568}
.d-sind-ico{font-size:1.1rem}.d-sind-ttl{font-weight:600;font-size:.82rem}.d-sind-sub{font-size:.68rem;opacity:.7;margin-top:1px}
.d-load{padding:40px 16px;text-align:center;color:var(--mut);font-size:.85rem}
/* Search pin */
.spin{width:24px;height:36px;display:flex;flex-direction:column;align-items:center}
.spin-c{width:22px;height:22px;border-radius:50%;background:#E53E3E;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.spin-t{width:3px;flex:1;background:#E53E3E;border-radius:0 0 2px 2px}
/* Mobil bottom sheet */
#msheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.13);z-index:600;display:flex;flex-direction:column;height:45vh;transition:height .3s ease}
#msheet.tall{height:75vh}
#msh{padding:10px 0 6px;display:flex;justify-content:center;cursor:pointer;flex-shrink:0}
.hbar{width:48px;height:6px;border-radius:3px;background:#B0B8C4}
#mstop{padding:0 16px 10px;flex-shrink:0;border-bottom:1px solid var(--bdr)}
#mssun{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700}
#mscount{font-size:.71rem;color:var(--mut);margin-top:2px}
#msbody{overflow-y:auto;flex:1;padding:10px 12px 12px;-webkit-overflow-scrolling:touch}
.mrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer;border:1.5px solid var(--bdr);margin-bottom:7px;background:#fff}
.mrow.sun{border-color:rgba(245,166,35,.35);background:#FFFBF2}
.mrow:active{opacity:.75}
.mrow-img{width:50px;height:50px;border-radius:9px;flex-shrink:0;background:var(--lt);display:flex;align-items:center;justify-content:center;font-size:1.3rem;overflow:hidden}
.mrow-img img{width:50px;height:50px;object-fit:cover;border-radius:9px}
.mrow-info{flex:1;min-width:0}
.mrow-name{font-weight:600;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow-typ{font-size:.7rem;color:var(--mut);margin-top:1px}
.mrow-meta{font-size:.7rem;color:var(--mut);margin-top:2px}
.mrow-rat{color:var(--warm);font-weight:600}
.mbadge{flex-shrink:0;font-size:.69rem;font-weight:600;padding:3px 9px;border-radius:50px}
.mbadge.sun{background:var(--pale);color:#8B5E00}.mbadge.shade{background:#EDF0F5;color:#4A5568}
/* Mobil detail sheet */
#dsheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -6px 28px rgba(0,0,0,.15);z-index:700;display:flex;flex-direction:column;max-height:92vh;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1)}
#dsheet.open{transform:translateY(0)}
#dshandle{padding:10px 0 4px;display:flex;justify-content:center;cursor:pointer;flex-shrink:0}
#dscl{position:absolute;top:12px;right:14px;width:28px;height:28px;border-radius:50%;background:var(--lt);border:none;cursor:pointer;font-size:.95rem;color:var(--mut);display:flex;align-items:center;justify-content:center}
#dsbody{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
/* Mobil tid pill */
#tpill{position:fixed;bottom:calc(47vh + 10px);left:50%;transform:translateX(-50%);background:#fff;border-radius:50px;padding:7px 14px;box-shadow:0 4px 18px rgba(0,0,0,.14);z-index:601;display:flex;align-items:center;gap:10px;border:1px solid var(--bdr);white-space:nowrap;transition:bottom .3s ease}
#tpill.tall{bottom:calc(77vh + 10px)}
.tplbl{font-size:.6rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
#tpdis{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;color:var(--txt);min-width:2.4rem;text-align:center}
#tpsl{width:110px;-webkit-appearance:none;height:3px;border-radius:2px;outline:none;cursor:pointer;background:linear-gradient(to right,var(--sun) 50%,#C8D1DC 50%);touch-action:none}
#tpsl::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--sun);border:3px solid #fff;box-shadow:0 1px 8px rgba(0,0,0,.22)}
#tplive{background:none;border:none;cursor:pointer;font-size:1.1rem;padding:0;line-height:1}
/* Loading + toast */
#loading{position:fixed;inset:0;background:rgba(250,250,248,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2000;transition:opacity .4s}
#loading.gone{opacity:0;pointer-events:none}
.lsun{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE08A,#F5A623);animation:glow 2s ease-in-out infinite;margin-bottom:14px}
.ltxt{font-family:'Playfair Display',serif;font-size:.9rem;color:var(--mut)}
#toast{position:fixed;top:calc(var(--bh)+10px);left:50%;transform:translateX(-50%) translateY(-4px);background:var(--txt);color:#fff;padding:7px 16px;border-radius:50px;font-size:.75rem;font-weight:500;z-index:9999;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.leaflet-control-attribution{display:none}
@media(max-width:700px){
  #map{right:0!important}
  #panel,#dpanel{display:none!important}
  #tc,#lbtn{display:none!important}
}
@media(min-width:701px){
  #msheet,#dsheet,#tpill{display:none!important}
}
#nov{position:fixed;top:var(--bh);left:0;right:var(--pw);bottom:0;pointer-events:none;z-index:1;background:rgba(10,15,30,0);transition:background 2s ease}
@media(max-width:700px){#nov{right:0}}
.arcbox,.d-arc,.sectit{display:none!important}#ds .sgrid,#ds .arcbox,#ds .sectit:not(#nltl),#sind{display:none!important}
.d-hours{margin-bottom:12px;background:var(--lt);border-radius:10px;padding:10px 12px}.d-hours-row{display:flex;justify-content:space-between;font-size:.75rem;padding:3px 0;border-bottom:1px solid rgba(0,0,0,.05)}.d-hours-row:last-child{border-bottom:none}.d-hours-row.today{font-weight:700;color:var(--txt)}.d-hours-day{color:var(--mut)}.d-hours-row.today .d-hours-day{color:var(--txt)}

.d-gal-wrap{position:relative;margin-bottom:12px}
.d-gal-wrap .d-gal{margin-bottom:0;scroll-behavior:smooth}
.gal-btn{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;background:rgba(255,255,255,.9);border:none;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:2;transition:background .15s}
.gal-btn:hover{background:#fff}
.gal-btn.prev{left:8px}
.gal-btn.next{right:8px}
</style>
</head>
<body>
<div id="loading"><div class="lsun"></div><div class="ltxt">Indlæser Solvejr…</div></div>
<div id="bar">
  <a class="logo" href="#"><div class="logo-sun"></div><div class="logo-name">Sol<em>vejr</em></div></a>
  <div id="sw">
    <div id="srch">
      <svg style="width:13px;height:13px;fill:var(--mut);flex-shrink:0" viewBox="0 0 20 20"><path d="M8.5 3a5.5 5.5 0 1 0 3.516 9.723l3.63 3.63a.75.75 0 1 0 1.061-1.06l-3.63-3.631A5.5 5.5 0 0 0 8.5 3zM4.5 8.5a4 4 0 1 1 8 0 4 4 0 0 1-8 0z"/></svg>
      <input id="sinp" type="text" placeholder="Søg adresse eller sted..." autocomplete="off">
      <button id="sbtn"><svg viewBox="0 0 20 20"><path d="M8.5 3a5.5 5.5 0 1 0 3.516 9.723l3.63 3.63a.75.75 0 1 0 1.061-1.06l-3.63-3.631A5.5 5.5 0 0 0 8.5 3zM4.5 8.5a4 4 0 1 1 8 0 4 4 0 0 1-8 0z"/></svg></button>
    </div>
    <div id="sug"></div>
  </div>
  <div id="tc">
    <div class="tlbl">Tid</div>
    <div id="tdis">--:--</div>
    <input id="tsl" type="range" min="0" max="1439" value="720" step="5">
  </div>
  <button id="lbtn" class="on"><span class="dot"></span>Live</button>
</div>
<div id="map"></div><div id="nov"></div>
<div id="dpanel">
  <button id="dpcl">&#x2715;</button>
  <div id="dpbody"><div class="d-load">Vaelg et sted</div></div>
</div>
<div id="panel">
  <div id="ptop">
    <div class="pname" id="pname">Solvejr</div>
    <div class="psub">Find sol i Danmark</div>
    <div id="sind" class="sind shade" style="display:none">
      <div class="sind-ico" id="sico">&#127769;</div>
      <div><div class="sind-ttl" id="sttl">&#8212;</div><div class="sind-sub" id="ssub">&#8212;</div></div>
    </div>
  </div>
  <div id="pbody">
    <div class="hint" id="hint"><div class="hi">&#9728;&#65039;</div><div class="ht">Søg en adresse</div><div class="hx">Find cafeer, restauranter og barer med sol</div></div>
    <div id="ds" style="display:none">
      <div class="sgrid">
        <div class="scard"><div class="slbl">Solopgang</div><div class="sval" id="dsr">&#8212;</div></div>
        <div class="scard"><div class="slbl">Solnedgang</div><div class="sval" id="dss">&#8212;</div></div>
        <div class="scard"><div class="slbl">Solhøjde</div><div class="sval" id="dsa">&#8212;<span class="sunit">°</span></div></div>
        <div class="scard"><div class="slbl">Retning</div><div class="sval" id="dsaz">&#8212;</div></div>
      </div>
      <div class="sectit">Solbane i dag</div>
      <div class="arcbox"><canvas id="arc" width="300" height="100"></canvas></div>
      <div class="sectit" id="nltl" style="display:none">Steder i nærheden</div>
      <div class="plist" id="pl"></div>
    </div>
  </div>
</div>
<div id="msheet">
  <div id="msh"><div class="hbar"></div></div>
  <div id="mstop"><div id="mssun">Søg en adresse for at finde sol</div><div id="mscount"></div></div>
  <div id="msbody"></div>
</div>
<div id="dsheet">
  <div id="dshandle"><div class="hbar"></div></div>
  <button id="dscl">&#x2715;</button>
  <div id="dsbody"></div>
</div>
<div id="tpill">
  <div class="tplbl">Tid</div>
  <div id="tpdis">--:--</div>
  <input id="tpsl" type="range" min="0" max="1439" value="720" step="5">
  <button id="tplive">&#9728;&#65039;</button>
</div>
<div id="toast"></div>
<script>
function updNight(){if(!window.SunCalc||SLA===null)return;var d=new Date(TOD+'T00:00:00');d.setHours(Math.floor(CRH),Math.round((CRH%1)*60),0,0);var alt=SunCalc.getPosition(d,SLA,SLO).altitude*180/Math.PI;var dk=alt>6?0:alt>-6?(6-alt)/12*0.3:alt>-18?0.3+(-6-alt)/12*0.4:0.7;var ov=document.getElementById('nov');if(ov)ov.style.background='rgba(10,15,30,'+dk.toFixed(3)+')';}

// ── Sol-matematik ─────────────────────────────────
function sunPos(lat,lon,date){
  var jd=date.getTime()/86400000+2440587.5,n=jd-2451545;
  var L=((280.46+0.9856474*n)%360+360)%360;
  var g=(357.528+0.9856003*n)*Math.PI/180;
  var lam=((L+1.915*Math.sin(g)+0.02*Math.sin(2*g))*Math.PI/180);
  var eps=(23.439-0.0000004*n)*Math.PI/180;
  var sinD=Math.sin(eps)*Math.sin(lam),cosD=Math.cos(Math.asin(sinD));
  var UT=date.getUTCHours()+date.getUTCMinutes()/60+date.getUTCSeconds()/3600;
  var GMST=((6.697375+0.0657098242*n+UT)%24+24)%24;
  var LST=((GMST+lon/15)%24+24)%24;
  var HA=(LST-12)*15*Math.PI/180;
  var lr=lat*Math.PI/180;
  var sinA=Math.sin(lr)*sinD+Math.cos(lr)*cosD*Math.cos(HA);
  var alt=Math.asin(Math.max(-1,Math.min(1,sinA)))*180/Math.PI;
  var cosAz=(sinD-Math.sin(lr)*sinA)/(Math.cos(lr)*Math.cos(alt*Math.PI/180));
  var az=Math.acos(Math.max(-1,Math.min(1,cosAz)))*180/Math.PI;
  if(Math.sin(HA)>0)az=360-az;
  return{alt:alt,az:az};
}
function shAt(lat,lon,h){
  if(typeof SunCalc==='undefined'){
    // Fallback: simpel beregning
    var d=new Date(TOD+'T00:00:00Z');
    d.setUTCMinutes(Math.round(h*60)+new Date().getTimezoneOffset());
    return sunPos(lat,lon,d);
  }
  var d=new Date(TOD+'T00:00:00');
  d.setHours(Math.floor(h), Math.round((h%1)*60), 0, 0);
  var pos=SunCalc.getPosition(d,lat,lon);
  return{alt:pos.altitude*180/Math.PI, az:((pos.azimuth*180/Math.PI)+180+360)%360};
}
function rS(lat,lon){
  if(typeof SunCalc==='undefined'){
    var tz=new Date().getTimezoneOffset(),ri=null,se=null,pv=null;
    for(var m=0;m<=1440;m+=3){
      var d=new Date(TOD+'T00:00:00Z');d.setUTCMinutes(m+tz);
      var a=sunPos(lat,lon,d).alt;
      if(pv!==null){if(pv<0&&a>=0&&!ri)ri=m/60;if(pv>=0&&a<0&&!se)se=m/60;}
      pv=a;
    }
    return{ri:ri,se:se};
  }
  var d=new Date(TOD);
  var times=SunCalc.getTimes(d,lat,lon);
  var ri=times.sunrise.getHours()+times.sunrise.getMinutes()/60;
  var se=times.sunset.getHours()+times.sunset.getMinutes()/60;
  return{ri:isNaN(ri)?null:ri, se:isNaN(se)?null:se};
}
function fH(h){if(h===null)return'&#8212;';return pad(Math.floor(h))+':'+pad(Math.round(h%1*60)%60)}
function azN(a){return['N','NNØ','NØ','ØNØ','Ø','ØSØ','SØ','SSØ','S','SSV','SV','VSV','V','VNV','NV','NNV'][Math.round(a/22.5)%16]}

// ── Skyggekort ────────────────────────────────────
function updSh(){
  if(!MAP||SLA===null)return;
  if(SHL){MAP.removeLayer(SHL);SHL=null;}
  var month=pad(new Date(TOD).getMonth()+1);
  // Brug lokal time direkte til tiles - præcis som shady.dk
  var h=Math.min(21,Math.max(6,Math.round(CRH)));
  // Beregn faktisk solhøjde med SunCalc for opacity
  var now=new Date(TOD+'T00:00:00');
  now.setHours(Math.floor(CRH), Math.round((CRH%1)*60), 0, 0);
  var sunAlt = SunCalc ? SunCalc.getPosition(now, SLA, SLO).altitude * 180/Math.PI : 10;
  // Fade: fuld opacity over 6°, ingen under -6°
  var fade = Math.max(0, Math.min(1, (sunAlt + 6) / 12));
  if(fade <= 0)return;
  var z=MAP.getZoom(), baseOp=z<=16?0.65:Math.max(0,0.65-(z-16)*0.25);
  var op=baseOp*fade;
  if(op<=0)return;
  SHL=L.tileLayer('https://tiles.fra1.digitaloceanspaces.com/'+month+'/617_72/tiles/'+pad(h)+'/{z}/{x}/{y}.png',
    {tms:true,opacity:op,attribution:'',maxNativeZoom:16,maxZoom:22});
  SHL.addTo(MAP);
  MAP.off('zoomend',MAP._shz);
  MAP._shz=function(){
    if(!SHL)return;
    var z2=MAP.getZoom(),op2=z2<=16?0.65:Math.max(0,0.65-(z2-16)*0.25);
    if(op2<=0){MAP.removeLayer(SHL);SHL=null;}else SHL.setOpacity(op2*fade);
  };
  MAP.on('zoomend',MAP._shz);
}

// ── Søge-pin ──────────────────────────────────────
function showPin(lat,lon,nm){
  if(SPIN){MAP.removeLayer(SPIN);SPIN=null;}
  var icon=L.divIcon({

    className:'',iconSize:[24,36],iconAnchor:[12,36]

  SPIN.bindPopup('<strong style="font-family:Playfair Display,serif;font-size:.9rem">'+nm+'</strong>',
    {offset:[0,-38],closeButton:false}).openPopup();
  MAP.flyTo([lat,lon],17,{animate:true,duration:0.9});
}

// ── Sol-bue ───────────────────────────────────────
function drawArc(lat,lon,id){
  var cv=document.getElementById(id||'arc');if(!cv)return;
  var ctx=cv.getContext('2d'),W=cv.width,H=cv.height,base=H-12,r=H-20;
  ctx.clearRect(0,0,W,H);
  ctx.beginPath();ctx.moveTo(6,base);ctx.lineTo(W-6,base);ctx.strokeStyle='#CDD4DF';ctx.lineWidth=1.5;ctx.stroke();
  var pts=[];
  for(var h=0;h<=24;h+=0.25){var a=shAt(lat,lon,h);if(a.alt>0)pts.push({x:W*h/24,y:base-r*(a.alt/85)})}
  if(pts.length>1){
    var gr=ctx.createLinearGradient(0,0,0,base);
    gr.addColorStop(0,'rgba(245,166,35,.22)');gr.addColorStop(1,'rgba(245,166,35,0)');
    ctx.beginPath();ctx.moveTo(pts[0].x,base);
    pts.forEach(function(p){ctx.lineTo(p.x,p.y)});
    ctx.lineTo(pts[pts.length-1].x,base);ctx.closePath();ctx.fillStyle=gr;ctx.fill();
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
    pts.forEach(function(p){ctx.lineTo(p.x,p.y)});
    ctx.strokeStyle='#F5A623';ctx.lineWidth=2;ctx.stroke();
  }
  var nx=W*CRH/24,cp=shAt(lat,lon,CRH);
  ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(nx,base);ctx.lineTo(nx,4);
  ctx.strokeStyle='rgba(245,166,35,.4)';ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([]);
  if(cp.alt>0){
    var sy=base-r*(cp.alt/85);
    ctx.beginPath();ctx.arc(nx,sy,6,0,2*Math.PI);ctx.fillStyle='#F5A623';
    ctx.shadowColor='rgba(245,166,35,.6)';ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(nx,sy,2.5,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();
  }
  var rs=rS(lat,lon);ctx.fillStyle='#9AAAB8';ctx.font='8px Outfit,sans-serif';
  if(rs.ri)ctx.fillText(fH(rs.ri).replace('&#8212;',''),Math.max(2,W*rs.ri/24-10),H);
  if(rs.se)ctx.fillText(fH(rs.se).replace('&#8212;',''),Math.min(W-28,W*rs.se/24-10),H);
}

// ── Desktop sidepanel ─────────────────────────────
function upPanel(lat,lon,nm){
  SLA=lat;SLO=lon;
  document.getElementById('pname').textContent=nm||'Valgt sted';
  var p=shAt(lat,lon,CRH),isSun=p.alt>4;
  var si=document.getElementById('sind');si.style.display='flex';
  si.className='sind '+(isSun?'sun':'shade');
  document.getElementById('sico').textContent=isSun?'☀️':(p.alt>0?'🏙️':'🌙');
  document.getElementById('sttl').textContent=isSun?'Sol på stedet':(p.alt>0?'Mulig skygge':'Solen er nede');
  document.getElementById('ssub').textContent=p.alt.toFixed(1)+'° · '+azN(p.az);
  var rs=rS(lat,lon);
  document.getElementById('dsr').textContent=fH(rs.ri);
  document.getElementById('dss').textContent=fH(rs.se);
  document.getElementById('dsa').innerHTML=p.alt.toFixed(1)+'<span class="sunit">°</span>';
  document.getElementById('dsaz').textContent=azN(p.az);
  drawArc(lat,lon,'arc');
  document.getElementById('hint').style.display='none';
  document.getElementById('ds').style.display='block';
}

// ── Markører ──────────────────────────────────────
function updMk(){
  MARKERS.forEach(function(m){
    var isSun=shAt(m.la,m.lo,CRH).alt>4;
    m.mk.getElement()&&(m.mk.getElement().style.background=isSun?'#F5A623':'#8A9BB0');
  });
  // Opdater badges i listerne
  if(!window.ALLE||!window.ALLE.length)return;
  var sunny=0;
  window.ALLE.forEach(function(p,i){
    var isSun=shAt(p.lat,p.lon,CRH).alt>4;
    if(isSun)sunny++;
    var dBtn=document.getElementById('pl').children[i];
    if(dBtn){
      dBtn.className='pitem'+(isSun?' snow':'');
      var dot=dBtn.querySelector('.pdot');if(dot)dot.className='pdot '+(isSun?'sun':'shade');
      var b=dBtn.querySelector('.psun2');if(b){b.className='psun2 '+(isSun?'sun':'shade');b.innerHTML=isSun?'☀️<br>Sol':'🌙<br>Skygge';}
    }
    var mRow=document.getElementById('msbody').children[i];
    if(mRow){
      mRow.className='mrow'+(isSun?' sun':'');
      var mb=mRow.querySelector('.mbadge');if(mb){mb.className='mbadge '+(isSun?'sun':'shade');}
    }
  });
  var el=document.getElementById('mssun');if(el)el.textContent=sunny+' i sol · '+(window.ALLE.length-sunny)+' i skygge';
}

// ── Detail indhold ────────────────────────────────
function detailHTML(p,W){
  var isSun=shAt(p.lat,p.lon,CRH).alt>4;
  var sp=shAt(p.lat,p.lon,CRH),rs=rS(p.lat,p.lon);
  var gal='';
  if(p.photos&&p.photos.length){
    gal='<div class="d-gal">';
    p.photos.forEach(function(u){gal+='<img src="'+u+'" alt="" loading="lazy">';});
    gal+='</div>';
  } else if(p.photo){
    gal='<div class="d-gal"><img src="'+p.photo+'" alt="" style="width:100%;height:175px;object-fit:cover"></div>';
  } else {
    gal='<div style="height:100px;background:var(--lt);display:flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:12px">&#127869;</div>';
  }
  var chips='';
  if(p.rating)chips+='<span class="d-chip"><span style="color:var(--warm);font-weight:700">&#9733; '+p.rating.toFixed(1)+'</span> ('+p.reviews+')</span>';
  if(p.price!==null&&p.price!==undefined&&PRICE[p.price])chips+='<span class="d-chip">'+PRICE[p.price]+'</span>';
  chips+='<span class="d-chip">'+p.type+'</span>';
  var links='';
  if(p.website)links+='<a href="'+p.website+'" target="_blank">&#127760; Website</a>';
  if(p.phone)links+='<a href="tel:'+p.phone+'">&#128222; '+p.phone+'</a>';
  var openH='';
  if(p.openNow===true)openH='<div class="d-open">&#9679; Åben nu</div>';
  else if(p.openNow===false)openH='<div class="d-closed">&#9679; Lukket nu</div>';
  var hoursH='';
  if(p.hours&&p.hours.length){
    var todayIdx=new Date().getDay();
    hoursH='<div class="d-hours">';
    p.hours.forEach(function(line,i){
      var colon=line.indexOf(': ');
      var day=colon>-1?line.slice(0,colon):line;
      var time=colon>-1?line.slice(colon+2):'';
      var isToday=(i===(todayIdx===0?6:todayIdx-1));
      hoursH+='<div class="d-hours-row'+(isToday?' today':'')+'"><span class="d-hours-day">'+day+'</span><span>'+time+'</span></div>';
    });
    hoursH+='</div>';
  }
  return gal+
    '<div class="d-pad">'+
      '<div class="d-name">'+p.name+'</div>'+
      '<div class="d-addr">'+(p.addr||'')+'</div>'+
      openH+
      (links?'<div class="d-links">'+links+'</div>':'')+hoursH+
      '<div class="d-sind '+(isSun?'sun':'shade')+'">'+
        '<div class="d-sind-ico">'+(isSun?'☀️':'🌙')+'</div>'+
        '<div><div class="d-sind-ttl">'+'</div>'+
        '<div class="d-sind-sub">'+sp.alt.toFixed(1)+'° · '+azN(sp.az)+'</div></div>'+
      '</div>'+
      '<div class="d-chips">'+chips+'</div>'+
      '<div class="sgrid" style="margin-bottom:12px">'+
        '<div class="scard"><div class="slbl">Solopgang</div><div class="sval">'+fH(rs.ri)+'</div></div>'+
        '<div class="scard"><div class="slbl">Solnedgang</div><div class="sval">'+fH(rs.se)+'</div></div>'+
        '<div class="scard"><div class="slbl">Solhøjde</div><div class="sval">'+sp.alt.toFixed(1)+'<span class="sunit">°</span></div></div>'+
        '<div class="scard"><div class="slbl">Retning</div><div class="sval">'+azN(sp.az)+'</div></div>'+
      '</div>'+
      '<div class="sectit" style="margin-bottom:6px">Solbane i dag</div>'+
      '<div class="arcbox"><canvas id="darc" width="'+(W||270)+'" height="90"></canvas></div>'+
    '</div>';
}

// ── Hent Google detaljer ──────────────────────────
function loadDetail(p,mobile){
  var svc=new google.maps.places.PlacesService(document.createElement('div'));
  svc.getDetails({
    placeId:p.placeId,
    fields:['name','rating','user_ratings_total','formatted_address',
            'formatted_phone_number','opening_hours','photos','website','price_level']
  },function(d,st){
    if(st==='OK'&&d){
      if(d.photos&&d.photos.length){
        p.photos=d.photos.slice(0,6).map(function(ph){
          try{return ph.getUrl({maxWidth:600,maxHeight:400});}catch(e){return null;}
        }).filter(Boolean);
      }
      p.openNow=d.opening_hours?d.opening_hours.open_now:null;
      p.hours=d.opening_hours&&d.opening_hours.weekday_text?d.opening_hours.weekday_text:null;
      p.website=d.website||null;
      p.phone=d.formatted_phone_number||null;
    }
    if(mobile){
      document.getElementById('dsbody').innerHTML=detailHTML(p,260);
    } else {
      document.getElementById('dpbody').innerHTML=detailHTML(p,270);
    }
    setTimeout(function(){drawArc(p.lat,p.lon,'darc');},80);
  });
}

// ── Åbn detail ────────────────────────────────────
function openDetail(p){
  showPin(p.lat,p.lon,p.name);
  upPanel(p.lat,p.lon,p.name);
  if(isMob()){
    document.getElementById('dsbody').innerHTML='<div class="d-load">Henter info...</div>';
    var ds=document.getElementById('dsheet');
    ds.style.display='flex';
    requestAnimationFrame(function(){ds.classList.add('open');});
    loadDetail(p,true);
  } else {
    document.getElementById('dpbody').innerHTML='<div class="d-load">Henter info...</div>';
    document.getElementById('dpanel').classList.add('open');
    
    updSh();
    loadDetail(p,false);
  }
}

// ── Google Places ─────────────────────────────────
function near(lat,lon){
  MARKERS.forEach(function(m){m.mk.remove();});MARKERS=[];
  document.getElementById('pl').innerHTML='';
  document.getElementById('nltl').style.display='none';
  document.getElementById('msbody').innerHTML='';
  document.getElementById('mscount').textContent='Henter steder...';
  var svc=new google.maps.places.PlacesService(document.createElement('div'));
  var types=['cafe','restaurant','bar'];
  var tlbl={cafe:'Café',restaurant:'Restaurant',bar:'Bar'};
  var all=[],done=0;
  types.forEach(function(t){
    svc.nearbySearch({
      location:new google.maps.LatLng(lat,lon),
      radius:1000,
      type:t
    },function(res,st){
      if(st==='OK'&&res){
        res.forEach(function(r){
          if(all.find(function(x){return x.name===r.name;}))return;
          var ph=null;
          try{if(r.photos&&r.photos.length)ph=r.photos[0].getUrl({maxWidth:140,maxHeight:140});}catch(e){}
          all.push({
            name:r.name,lat:r.geometry.location.lat(),lon:r.geometry.location.lng(),
            type:tlbl[t],photo:ph,rating:r.rating||null,reviews:r.user_ratings_total||0,
            price:typeof r.price_level==='number'?r.price_level:null,
            addr:r.vicinity||'',placeId:r.place_id
          });
        });
      }
      done++;
      if(done===types.length)renderAll(all);
    });
  });
}

function renderAll(all){
  window.ALLE=all;
  all.sort(function(a,b){
    var as=shAt(a.lat,a.lon,CRH).alt>4?1:0;
    var bs=shAt(b.lat,b.lon,CRH).alt>4?1:0;
    if(bs!==as)return bs-as;
    return(b.rating||0)-(a.rating||0);
  });
  var sunny=0;
  var dpl=document.getElementById('pl');
  var mpl=document.getElementById('msbody');
  dpl.innerHTML='';mpl.innerHTML='';
  all.forEach(function(p){
    var isSun=shAt(p.lat,p.lon,CRH).alt>4;
    if(isSun)sunny++;
    // Markør
    var mkEl=document.createElement('div');
    mkEl.style.cssText='width:18px;height:18px;border-radius:50%;background:'+(isSun?'#F5A623':'#8A9BB0')+';border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25)';
    var icon=L.divIcon({html:mkEl.outerHTML,className:'',iconSize:[18,18],iconAnchor:[9,9]});
    var mk=L.marker([p.lat,p.lon],{icon:icon}).addTo(MAP);
    MARKERS.push({la:p.lat,lo:p.lon,mk:mk});
    mk.on('click',function(){openDetail(p);});
    // Desktop
    var imgH=p.photo?'<img class="pimg" src="'+p.photo+'" alt="" loading="lazy">':'<div class="pimg-ph">&#127869;</div>';
    var meta=[];
    if(p.rating)meta.push('<span class="prat">&#9733; '+p.rating.toFixed(1)+'</span> ('+p.reviews+')');
    if(p.price!==null&&PRICE[p.price])meta.push(PRICE[p.price]);
    var btn=document.createElement('button');
    btn.className='pitem'+(isSun?' snow':'');
    btn.innerHTML=imgH+'<div class="pinner"><div class="pdot '+(isSun?'sun':'shade')+'"></div><div class="pinfo"><div class="pn2">'+p.name+'</div><div class="ptyp">'+p.type+'</div>'+(meta.length?'<div class="pmeta">'+meta.join(' · ')+'</div>':'')+'</div></div>';
    btn.addEventListener('click',function(){openDetail(p);});
    dpl.appendChild(btn);
    // Mobil
    var mimg=p.photo?'<div class="mrow-img"><img src="'+p.photo+'" alt="" loading="lazy"></div>':'<div class="mrow-img">&#127869;</div>';
    var mmeta=[];
    if(p.rating)mmeta.push('<span class="mrow-rat">&#9733; '+p.rating.toFixed(1)+'</span> ('+p.reviews+')');
    if(p.price!==null&&PRICE[p.price])mmeta.push(PRICE[p.price]);
    var mrow=document.createElement('div');
    mrow.className='mrow'+(isSun?' sun':'');
    mrow.innerHTML=mimg+'<div class="mrow-info"><div class="mrow-name">'+p.name+'</div><div class="mrow-typ">'+p.type+'</div>'+(mmeta.length?'<div class="mrow-meta">'+mmeta.join(' · ')+'</div>':'')+'</div>';
    mrow.addEventListener('click',function(){openDetail(p);});
    mpl.appendChild(mrow);
  });
  if(all.length){
    document.getElementById('nltl').style.display='block';
    document.getElementById('mssun').textContent=sunny+' i sol · '+(all.length-sunny)+' i skygge';
    document.getElementById('mscount').textContent=all.length+' steder inden for 600m';
    toast('☀️ '+sunny+' i sol · 🌙 '+(all.length-sunny)+' i skygge');
  }
}

// ── Søgning ───────────────────────────────────────
var sugT=null;
document.getElementById('sinp').addEventListener('input',function(){
  var q=this.value.trim(),box=document.getElementById('sug');
  clearTimeout(sugT);if(q.length<2){box.style.display='none';return;}
  sugT=setTimeout(function(){
    var ac=new google.maps.places.AutocompleteService();
    ac.getPlacePredictions({input:q,componentRestrictions:{country:'dk'},language:'da'},function(preds,st){
      if(st!=='OK'||!preds){box.style.display='none';return;}
      box.innerHTML=preds.slice(0,5).map(function(p){
        return'<div class="si" data-pid="'+p.place_id+'"><div class="si-m">'+p.structured_formatting.main_text+'</div><div class="si-s">'+(p.structured_formatting.secondary_text||'')+'</div></div>';
      }).join('');
      box.style.display='block';
      box.querySelectorAll('.si').forEach(function(el){
        function go(){
          var ps=new google.maps.places.PlacesService(document.createElement('div'));
          ps.getDetails({placeId:el.dataset.pid,fields:['geometry','name','formatted_address']},function(pl,st){
            if(st!=='OK')return;
            var lat=pl.geometry.location.lat(),lon=pl.geometry.location.lng();
            var nm=pl.name||pl.formatted_address.split(',')[0];
            document.getElementById('sinp').value=nm;
            box.style.display='none';
            SLA=lat;SLO=lon;
            showPin(lat,lon,nm);
            upPanel(lat,lon,nm);
            near(lat,lon);
            updSh();
          });
        }
        el.addEventListener('mousedown',function(e){e.preventDefault();go();});
        el.addEventListener('touchend',function(e){e.preventDefault();go();});
      });
    });
  },240);
});
document.getElementById('sinp').addEventListener('blur',function(){
  setTimeout(function(){document.getElementById('sug').style.display='none';},200);
});
function doSearch(){
  var q=document.getElementById('sinp').value.trim();if(!q)return;
  document.getElementById('sug').style.display='none';
  fetch('https://maps.googleapis.com/maps/api/geocode/json?address='+encodeURIComponent(q+', Danmark')+'&key='+GMKEY)
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.results&&d.results[0]){
      var loc=d.results[0].geometry.location;
      var nm=d.results[0].formatted_address.split(',')[0];
      SLA=loc.lat;SLO=loc.lng;
      showPin(loc.lat,loc.lng,nm);
      upPanel(loc.lat,loc.lng,nm);
      near(loc.lat,loc.lng);
      updSh();
    }else toast('Adresse ikke fundet');
  }).catch(function(){toast('Søgning fejlede');});
}
document.getElementById('sbtn').addEventListener('click',doSearch);
document.getElementById('sinp').addEventListener('keydown',function(e){
  if(e.key==='Enter'){document.getElementById('sug').style.display='none';doSearch();}
});

// ── Leaflet init ──────────────────────────────────
MAP=L.map('map',{zoomControl:false}).setView([56.0,10.2],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:22}).addTo(MAP);
L.control.zoom({position:'topright'}).addTo(MAP);

// Opdater steder når kortet flyttes
var _nearTimer=null;
MAP.on('moveend',function(){
  clearTimeout(_nearTimer);
  _nearTimer=setTimeout(function(){
    if(MAP.getZoom()<14)return;
    var c=MAP.getCenter();
    SLA=c.lat;SLO=c.lng;
    near(c.lat,c.lng);
    updSh();
  },1000);
});

MAP.on('click',function(e){
  SLA=e.latlng.lat;SLO=e.latlng.lng;
  upPanel(SLA,SLO,'Valgt sted');
  near(SLA,SLO);updSh();
  if(isMob()){
    var ds=document.getElementById('dsheet');
    ds.classList.remove('open');
    setTimeout(function(){ds.style.display='none';},350);
  }
});

// ── Start ─────────────────────────────────────────
function start(lat,lon,nm){
  SLA=lat;SLO=lon;
  MAP.flyTo([lat,lon],16,{animate:true,duration:1});
  upPanel(lat,lon,nm);updSh();
  // Søg fra GPS-positionen direkte efter flyTo er færdigt
  setTimeout(function(){near(lat,lon);},1200);
}
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(
    function(pos){start(pos.coords.latitude,pos.coords.longitude,'Din placering');},
    function(){start(55.676,12.568,'København');}
  );
}else{start(55.676,12.568,'København');}
setT(CRH);
setTimeout(updNight,500);setTimeout(function(){document.getElementById('loading').classList.add('gone');},700);

(function(){var ds=document.getElementById('dsheet');if(!ds)return;var sy=0;ds.addEventListener('touchstart',function(e){sy=e.touches[0].clientY;ds.style.transition='none';},{passive:true});ds.addEventListener('touchmove',function(e){var dy=e.touches[0].clientY-sy;if(dy>0)ds.style.transform='translateY('+dy+'px)';},{passive:true});ds.addEventListener('touchend',function(e){ds.style.transition='transform .35s cubic-bezier(.4,0,.2,1)';var dy=e.changedTouches[0].clientY-sy;if(dy>80)document.getElementById('dscl').click();else ds.style.transform='';},{passive:true});})();

// Tilføj pile til billede-galleri
function addGalArrows(gal) {
  if(gal.parentNode && gal.parentNode.classList.contains('d-gal-wrap')) return;
  var wrap = document.createElement('div');
  wrap.className = 'd-gal-wrap';
  gal.parentNode.insertBefore(wrap, gal);
  wrap.appendChild(gal);
  var prev = document.createElement('button');
  prev.className = 'gal-arrow prev';
  prev.innerHTML = '&#8249;';
  prev.addEventListener('click', function(e){ e.stopPropagation(); gal.scrollBy({left:-150,behavior:'smooth'}); });
  var next = document.createElement('button');
  next.className = 'gal-arrow next';
  next.innerHTML = '&#8250;';
  next.addEventListener('click', function(e){ e.stopPropagation(); gal.scrollBy({left:150,behavior:'smooth'}); });
  wrap.appendChild(prev);
  wrap.appendChild(next);
}
// Observer der kigger efter nye d-gal elementer
var _galObs = new MutationObserver(function(muts){
  muts.forEach(function(m){
    m.addedNodes.forEach(function(n){
      if(n.nodeType===1){
        var gals = n.classList && n.classList.contains('d-gal') ? [n] : Array.from(n.querySelectorAll&&n.querySelectorAll('.d-gal')||[]);
        gals.forEach(addGalArrows);
      }
    });
  });
});
_galObs.observe(document.body, {childList:true, subtree:true});
