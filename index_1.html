<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solvejr — Find sol nu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,700;1,500&family=DM+Sans:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#F5A623;--amber:#E8863A;--cream:#FFF8EE;--bark:#2C1A0E;--slate:#3D4A5C}
html,body{height:100%;overflow:hidden;background:var(--cream);font-family:'DM Sans',sans-serif}
#topbar{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--cream);border-bottom:1px solid rgba(0,0,0,.08);box-shadow:0 2px 12px rgba(44,26,14,.1);padding:0 1rem;height:56px;display:flex;align-items:center;gap:.8rem}
.sun{width:28px;height:28px;background:var(--gold);border-radius:50%;flex-shrink:0;animation:sp 4s ease-in-out infinite}
@keyframes sp{0%,100%{box-shadow:0 0 0 5px rgba(245,166,35,.2)}50%{box-shadow:0 0 0 10px rgba(245,166,35,.1)}}
.logo{font-family:'Fraunces',serif;font-size:1.2rem;color:var(--bark);flex-shrink:0}
.logo span{color:var(--gold);font-style:italic}
#sw{flex:1;max-width:380px;display:flex;align-items:center;background:white;border-radius:50px;border:1.5px solid #e5ddd5;padding:0 .5rem 0 .9rem;gap:.3rem}
#sw:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,166,35,.15)}
#si{flex:1;border:none;outline:none;font-size:.88rem;color:var(--bark);background:transparent;padding:.5rem 0}
#si::placeholder{color:#b0a89e}
#sb{background:var(--gold);border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#sb svg{width:12px;height:12px;fill:white}
#tv{font-family:'Fraunces',serif;font-size:.95rem;color:var(--bark);min-width:2.6rem;text-align:center;flex-shrink:0}
#ts{width:90px;-webkit-appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,var(--gold),#ddd);outline:none;cursor:pointer;flex-shrink:0}
#ts::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid white;box-shadow:0 1px 5px rgba(0,0,0,.2)}
#lb{padding:.3rem .8rem;border-radius:50px;background:#fdf0e0;border:1.5px solid #FFD166;color:var(--amber);font-size:.72rem;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:.3rem;flex-shrink:0}
#lb.on{background:var(--gold);color:white;border-color:var(--gold)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
#map{position:fixed;top:56px;left:0;right:300px;bottom:0}
#panel{position:fixed;top:56px;right:0;bottom:0;width:300px;background:var(--cream);border-left:1px solid rgba(0,0,0,.07);display:flex;flex-direction:column}
#ph{padding:1rem 1rem .5rem}
.pn{font-family:'Fraunces',serif;font-size:1.1rem;color:var(--bark)}
.pt{font-size:.72rem;color:#999;margin-top:2px}
#pb{padding:.8rem 1rem;overflow-y:auto;flex:1}
.sbadge{display:inline-flex;align-items:center;gap:.4rem;padding:.4rem .85rem;border-radius:50px;font-size:.8rem;font-weight:500;margin-bottom:.9rem}
.sbadge.up{background:#fff4dc;color:#b07800;border:1px solid #ffe09a}
.sbadge.dn{background:#eef0ff;color:#4a5080;border:1px solid #c5c8f0}
.ps{margin-bottom:.9rem}
.ps h4{font-size:.65rem;text-transform:uppercase;letter-spacing:.07em;color:#bbb;margin-bottom:.35rem}
.ir{display:flex;justify-content:space-between;font-size:.8rem;padding:.28rem 0;border-bottom:1px solid rgba(0,0,0,.05)}
.ir:last-child{border-bottom:none}
.ir span{color:#aaa}
.ir strong{color:var(--bark);font-weight:500}
.hint{font-size:.8rem;color:#bbb;text-align:center;padding:2rem 1rem;line-height:1.7}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--bark);color:white;padding:.4rem 1rem;border-radius:50px;font-size:.76rem;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="topbar">
  <div class="sun"></div>
  <div class="logo">Sol<span>vejr</span></div>
  <div id="sw">
    <svg style="width:13px;height:13px;fill:#bbb;flex-shrink:0" viewBox="0 0 20 20"><path d="M8.5 3a5.5 5.5 0 1 0 3.516 9.723l3.63 3.63a.75.75 0 1 0 1.061-1.06l-3.63-3.631A5.5 5.5 0 0 0 8.5 3zm-4 5.5a4 4 0 1 1 8 0 4 4 0 0 1-8 0z"/></svg>
    <input type="text" id="si" placeholder="Søg adresse, café, restaurant…" autocomplete="off">
    <button id="sb"><svg viewBox="0 0 20 20"><path d="M8.5 3a5.5 5.5 0 1 0 3.516 9.723l3.63 3.63a.75.75 0 1 0 1.061-1.06l-3.63-3.631A5.5 5.5 0 0 0 8.5 3zm-4 5.5a4 4 0 1 1 8 0 4 4 0 0 1-8 0z"/></svg></button>
  </div>
  <span id="tv">12:00</span>
  <input type="range" id="ts" min="0" max="1440" value="720" step="5">
  <button id="lb" class="on"><span class="dot"></span> Live</button>
</div>
<div id="map"></div>
<div id="panel">
  <div id="ph"><div class="pn" id="pn">Solvejr ☀️</div><div class="pt" id="pt">Find sol i Danmark</div></div>
  <div id="pb">
    <div class="hint" id="hint">Søg en adresse eller klik på kortet for at finde caféer og restauranter i solen 📍</div>
    <div id="ci" style="display:none">
      <div id="sunb" class="sbadge up">☀️ Sol lige nu</div>
      <div class="ps"><h4>Detaljer</h4>
        <div class="ir"><span>Solopgang</span><strong id="dr">—</strong></div>
        <div class="ir"><span>Solnedgang</span><strong id="ds">—</strong></div>
        <div class="ir"><span>Solhøjde</span><strong id="da">—</strong></div>
        <div class="ir"><span>Retning</span><strong id="daz">—</strong></div>
      </div>
      <div class="ps"><h4>Sol i dag</h4>
        <canvas id="arc" width="250" height="100" style="width:100%;background:#f5f0e8;border-radius:8px"></canvas>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
function toRad(d){return d*Math.PI/180}
function toDeg(r){return r*180/Math.PI}
function gsp(lat,lon,date){
  const jd=date.getTime()/86400000+2440587.5,n=jd-2451545;
  const L=(280.46+0.9856474*n)%360;
  const g=toRad(((357.528+0.9856003*n)%360+360)%360);
  const lam=toRad(L+1.915*Math.sin(g)+.02*Math.sin(2*g));
  const eps=toRad(23.439-.0000004*n);
  const sinDec=Math.sin(eps)*Math.sin(lam),cosDec=Math.cos(Math.asin(sinDec));
  const utcH=date.getUTCHours()+date.getUTCMinutes()/60+date.getUTCSeconds()/3600;
  const lmst=((6.697375+0.0657098242*n+utcH+lon/15)%24+24)%24;
  const ha=toRad((lmst-12)*15),latR=toRad(lat);
  const sinAlt=Math.sin(latR)*sinDec+Math.cos(latR)*cosDec*Math.cos(ha);
  const alt=toDeg(Math.asin(Math.max(-1,Math.min(1,sinAlt))));
  const cosAz=(sinDec-Math.sin(latR)*sinAlt)/(Math.cos(latR)*Math.cos(toRad(alt)));
  let az=toDeg(Math.acos(Math.max(-1,Math.min(1,cosAz))));
  if(Math.sin(ha)>0)az=360-az;
  return{alt,az};
}
function grs(lat,lon,ds){
  let rise=null,set=null,prev=null;
  for(let m=0;m<=1440;m+=5){
    const d=new Date(ds+'T00:00:00Z');d.setUTCMinutes(d.getUTCMinutes()-60+m);
    const{alt}=gsp(lat,lon,d);
    if(prev!==null){if(prev<0&&alt>=0&&!rise)rise=m/60-.04;if(prev>=0&&alt<0&&!set)set=m/60-.04;}
    prev=alt;
  }
  return{rise,set};
}
function sah(lat,lon,ds,h){const d=new Date(ds+'T00:00:00+01:00');d.setMinutes(d.getMinutes()+h*60);return gsp(lat,lon,d);}
function fmt(h){if(h===null)return'—';return String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round((h%1)*60)).padStart(2,'0')}
function azl(az){return['N','NNØ','NØ','ØNØ','Ø','ØSØ','SØ','SSØ','S','SSV','SV','VSV','V','VNV','NV','NNV'][Math.round(az/22.5)%16]}

const TODAY=new Date().toISOString().slice(0,10);
let gmap,gc,markers=[],slat=null,slon=null,live=true;
let curH=new Date().getHours()+new Date().getMinutes()/60;

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
function gts(h){return String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round((h%1)*60)%60).padStart(2,'0')}
const ts=document.getElementById('ts'),tv=document.getElementById('tv');
function setSl(h){ts.value=Math.round(h*60);tv.textContent=gts(h)}
ts.addEventListener('input',()=>{curH=parseInt(ts.value)/60;tv.textContent=gts(curH);live=false;document.getElementById('lb').classList.remove('on');refMk();if(slat!==null)upPanel(slat,slon);});
document.getElementById('lb').addEventListener('click',()=>{live=!live;document.getElementById('lb').classList.toggle('on',live);if(live)syncL();});
function syncL(){if(!live)return;const n=new Date();curH=n.getHours()+n.getMinutes()/60;setSl(curH);refMk();if(slat!==null)upPanel(slat,slon);}
setInterval(()=>{if(live)syncL();},30000);
setSl(curH);

function drawArc(lat,lon,ch){
  const cv=document.getElementById('arc'),ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height,cx=W/2,cy=H-8,r=Math.min(cx-10,H-15);
  ctx.clearRect(0,0,W,H);
  ctx.beginPath();ctx.moveTo(8,cy);ctx.lineTo(W-8,cy);ctx.strokeStyle='#ddd';ctx.lineWidth=1.5;ctx.stroke();
  const pts=[];
  for(let h=0;h<=24;h+=.25){const{alt,az}=sah(lat,lon,TODAY,h);if(alt>0){const ang=Math.PI-(az/180)*Math.PI,rr=r*(1-alt/90);pts.push({x:cx+rr*Math.cos(ang),y:cy-r*(alt/90)});}}
  if(pts.length>1){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.strokeStyle='#FFD166';ctx.lineWidth=2.5;ctx.stroke();}
  const{alt,az}=sah(lat,lon,TODAY,ch);
  if(alt>0){const ang=Math.PI-(az/180)*Math.PI,rr=r*(1-alt/90);ctx.beginPath();ctx.arc(cx+rr*Math.cos(ang),cy-r*(alt/90),6,0,2*Math.PI);ctx.fillStyle='#F5A623';ctx.shadowColor='rgba(245,166,35,.6)';ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;}
}

function upPanel(lat,lon){
  slat=lat;slon=lon;
  const now=new Date(TODAY+'T'+gts(curH)+':00+01:00');
  const{alt,az}=gsp(lat,lon,now);
  const{rise,set}=grs(lat,lon,TODAY);
  const isSun=alt>0;
  const b=document.getElementById('sunb');
  b.className='sbadge '+(isSun?'up':'dn');
  b.textContent=isSun?'☀️ Sol lige nu':'🌙 Ingen sol nu';
  document.getElementById('dr').textContent=fmt(rise);
  document.getElementById('ds').textContent=fmt(set);
  document.getElementById('da').textContent=alt.toFixed(1)+'°';
  document.getElementById('daz').textContent=az.toFixed(0)+'° '+azl(az);
  drawArc(lat,lon,curH);
  document.getElementById('hint').style.display='none';
  document.getElementById('ci').style.display='block';
}

function mkI(s){return{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:s?'#F5A623':'#8090b8',fillOpacity:1,strokeColor:'white',strokeWeight:2.5}}
function refMk(){markers.forEach(m=>{const{alt}=sah(m._lat,m._lon,TODAY,curH);m.setIcon(mkI(alt>0));})}

async function searchNearby(lat,lng){
  markers.forEach(m=>m.setMap(null));markers=[];
  try{
    const{Place}=await google.maps.importLibrary('places');
    const types=['cafe','restaurant','bar'];
    const tl={cafe:'Café',restaurant:'Restaurant',bar:'Bar'};
    const seen=new Set();
    for(const type of types){
      try{
        const{places}=await Place.searchNearby({
          fields:['displayName','location','formattedAddress'],
          locationRestriction:{center:{lat,lng},radius:700},
          includedPrimaryTypes:[type],
          maxResultCount:8
        });
        if(places) places.forEach(p=>{
          if(seen.has(p.displayName))return;
          seen.add(p.displayName);
          const plat=p.location.lat(),plng=p.location.lng();
          const{alt}=sah(plat,plng,TODAY,curH);
          const m=new google.maps.Marker({position:{lat:plat,lng:plng},map:gmap,title:p.displayName,icon:mkI(alt>0)});
          m._lat=plat;m._lon=plng;
          markers.push(m);
          m.addListener('click',()=>{
            document.getElementById('pn').textContent=p.displayName;
            document.getElementById('pt').textContent=tl[type]+(p.formattedAddress?' • '+p.formattedAddress.split(',')[0]:'');
            upPanel(plat,plng);
          });
        });
      }catch(e){console.warn(type,e);}
    }
    const sunN=markers.filter(m=>{const{alt}=sah(m._lat,m._lon,TODAY,curH);return alt>0}).length;
    if(markers.length) toast('☀️ '+sunN+' i sol  •  🌙 '+(markers.length-sunN)+' i skygge');
    else toast('Ingen steder fundet i nærheden');
  }catch(e){console.error('Places fejl:',e);toast('Kunne ikke hente steder');}
}

window.initMap=function(){
  gmap=new google.maps.Map(document.getElementById('map'),{
    center:{lat:55.676,lng:12.568},zoom:14,
    styles:[
      {featureType:'all',elementType:'geometry',stylers:[{color:'#f5efe6'}]},
      {featureType:'water',elementType:'geometry',stylers:[{color:'#c9dff0'}]},
      {featureType:'road',elementType:'geometry',stylers:[{color:'#fff'}]},
      {featureType:'road.arterial',elementType:'geometry',stylers:[{color:'#fde8c8'}]},
      {featureType:'park',elementType:'geometry',stylers:[{color:'#d8ecc4'}]},
      {featureType:'poi',elementType:'labels',stylers:[{visibility:'off'}]},
      {elementType:'labels.text.fill',stylers:[{color:'#7a6355'}]}
    ],
    disableDefaultUI:true,zoomControl:true,
    zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_CENTER},
    clickableIcons:false
  });
  gc=new google.maps.Geocoder();
  gmap.addListener('click',e=>{
    const lat=e.latLng.lat(),lng=e.latLng.lng();
    document.getElementById('pn').textContent='Valgt sted';
    document.getElementById('pt').textContent=lat.toFixed(4)+', '+lng.toFixed(4);
    upPanel(lat,lng);searchNearby(lat,lng);
  });
  document.getElementById('sb').addEventListener('click',doSearch);
  document.getElementById('si').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>{gmap.setCenter({lat:p.coords.latitude,lng:p.coords.longitude});upPanel(p.coords.latitude,p.coords.longitude);searchNearby(p.coords.latitude,p.coords.longitude);},
      ()=>searchNearby(55.676,12.568)
    );
  } else searchNearby(55.676,12.568);
};

function doSearch(){
  const q=document.getElementById('si').value.trim();if(!q)return;
  gc.geocode({address:q.includes(',')?q:q+', Danmark'},(results,status)=>{
    if(status==='OK'&&results[0]){
      const loc=results[0].geometry.location;
      gmap.setCenter(loc);gmap.setZoom(15);
      document.getElementById('pn').textContent=results[0].formatted_address.split(',')[0];
      document.getElementById('pt').textContent=results[0].formatted_address;
      upPanel(loc.lat(),loc.lng());searchNearby(loc.lat(),loc.lng());
    } else toast('Adresse ikke fundet — prøv igen');
  });
}

window.gm_authFailure=function(){
  document.getElementById('map').innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;flex-direction:column;gap:.8rem;padding:2rem;text-align:center"><div style="font-size:2rem">⚠️</div><b>Google Maps fejl</b><p style="font-size:.85rem;color:#999">API-nøglen virker ikke</p></div>';
};
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCrKdTkGmPgclGBEiwOKsgmkkAbTYUN07Q&libraries=places&callback=initMap&loading=async" async defer></script>
</body>
</html>
